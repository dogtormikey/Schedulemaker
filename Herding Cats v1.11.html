<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herding Cats — VEG ER for Pets</title>
<style>
/* VEG ER for Pets — brand red #eb2429, deep burgundy #6d0614, light blue accent.
   Brand red carries identity and primary actions; hard violations use the deeper
   burgundy so an error never reads as chrome; data meters use the blue. */
:root{
  color-scheme: light;
  --paper:#faf4f2; --surface:#ffffff; --surface-2:#f6eeeb;
  --ink:#1a0f10; --ink-2:#5b4a4b; --ink-3:#94807f;
  --rule:#eddfdb; --line:#dcc9c5;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#6d0614;
  --brand:#eb2429; --brand-mid:#f4888b; --brand-soft:#fdeceb; --brand-deep:#b81f24;
  --accent:#3a86c0; --accent-soft:#dcecf7; --accent-mid:#8fbfdf; --accent-deep:#24506e;
  --ring:rgba(26,15,16,.12);
  --shadow:0 1px 2px rgba(109,6,20,.07), 0 8px 26px rgba(109,6,20,.09);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  /* status pills */
  --amber-bg:#fdf2d9; --amber-bd:#e0bd68; --amber-fg:#8a5d05; --warn-fg:#96660a;
  --clash-bg:#f8e3e5; --clash-bd:#c98d95; --clash-fg:#6d0614;
  --nerd:#6b4ea8; --nerd-soft:#efe9f8; --nerd-mid:#b6a3dc;
  --ok-bg:#e4f5e4;    --ok-fg:#0a6b0a;
  --veil:rgba(26,15,16,.34);
  --hatch:#f8f0ed;
}
/* Dark mode is its own set of steps chosen against the dark surface, not an
   inverted copy of the light values. Every step clears 3:1 on --surface. */
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#120c0c; --surface:#1c1413; --surface-2:#291d1c;
  --ink:#fdf6f5; --ink-2:#cbb8b6; --ink-3:#9b8785;
  --rule:#362726; --line:#4b3835;
  --good:#22b722; --warn:#fab219; --serious:#ec835a; --crit:#ef6b6b;
  --brand:#f4534f; --brand-mid:#a83a3a; --brand-soft:#3a1a1a; --brand-deep:#ff8b84;
  --accent:#63a8dc; --accent-soft:#1e3448; --accent-mid:#3f6f95; --accent-deep:#8fc4e8;
  --ring:rgba(255,255,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.45);
  --amber-bg:#3a2c10; --amber-bd:#7a5c1c; --amber-fg:#f0c159; --warn-fg:#e0ab3c;
  --clash-bg:#3d1c1e; --clash-bd:#7d3f44; --clash-fg:#f28c8c;
  --nerd:#b9a3e8; --nerd-soft:#2a2140; --nerd-mid:#6b5a9c;
  --ok-bg:#12331a;    --ok-fg:#5fd45f;
  --veil:rgba(0,0,0,.6);
  --hatch:#241a19;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:60; background:var(--surface);
  border-bottom:1px solid var(--rule); padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{
  background:var(--brand);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;
  padding:4px 8px;border-radius:7px;line-height:1.15;flex:none;
}
.brand .txt{display:flex;flex-direction:column;line-height:1.15}
.brand h1{font-size:15px}
.brand .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase}
.monthnav{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);overflow:hidden}
.monthnav button{padding:6px 11px;color:var(--ink-2);font-size:15px;line-height:1}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{padding:6px 12px;font-weight:600;font-size:13.5px;min-width:148px;text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule);color:var(--ink)}
.monthnav .mlabel:hover{background:var(--brand-soft);color:var(--brand-deep)}
.cov{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr));gap:3px}
.cov-h{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:center;padding-bottom:2px}
.cov-h.we{color:var(--brand-deep)}
.cov-r{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-variant-numeric:tabular-nums}
.cov-r.noc{color:var(--accent-deep);font-weight:600}
.cov-c{height:27px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:transparent;font-size:11px;line-height:25px;text-align:center}
.cov-c:hover{border-color:var(--brand-mid);background:var(--brand-soft)}
.cov-c.on{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent-deep)}
.cov-c.on:hover{background:var(--brand-soft);border-color:var(--brand-mid)}
.cov-r.tot,.cov-c.tot{font-size:11px;font-weight:700;color:var(--ink-3);border:none;background:none;height:22px;line-height:22px}
.cov-c.tot{text-align:center;color:var(--ink-2)}
.cov-c.tot.we{color:var(--brand-deep)}
.prefbox{margin-top:8px}
.nerdrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.nerdrow.off{opacity:.5}
.nerdrow input{flex:1}
.nerdrow .ndot{width:9px;height:9px;border-radius:3px;background:var(--nerd-mid);flex:none}
.nerdrow .ncnt{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.nerdrow .btn{flex:none;padding:1px 7px}
.blockrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:2px 0 5px}
.blockrow .lbl{font-size:11.5px;color:var(--ink-3);margin-right:3px}
.bp{font-size:11px;border:1px solid var(--rule);border-radius:6px;padding:1px 7px;color:var(--ink-3);min-width:24px}
.bp:hover{border-color:var(--accent-mid);color:var(--accent)}
.bp.on{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent-deep);font-weight:700}
.prefsum{display:flex;align-items:center;gap:6px;width:100%;font-size:11.5px;color:var(--ink-3);text-align:left;padding:3px 0}
.prefsum b{color:var(--ink-2);font-weight:600}
.prefsum .ed{margin-left:auto;color:var(--accent);white-space:nowrap}
.preflist{margin-top:5px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.prefrow{display:flex;align-items:center;gap:7px;padding:3px 7px;font-size:11.5px;border-bottom:1px solid var(--rule)}
.prefrow:last-child{border-bottom:none}
.prefrow .r{width:15px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:10.5px}
.prefrow .l{flex:1;color:var(--ink-2)}
.prefrow.top .l{color:var(--ink);font-weight:600}
.prefrow .mv{border:1px solid var(--rule);border-radius:5px;width:20px;height:19px;line-height:17px;text-align:center;color:var(--ink-3);font-size:10px}
.prefrow .mv:hover{border-color:var(--accent-mid);color:var(--accent);background:var(--accent-soft)}
.prefrow .mv[disabled]{opacity:.3;pointer-events:none}
.pick .pref{font-size:10.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.btn{
  border:1px solid var(--rule); border-radius:8px; padding:6px 11px; font-size:13px;
  background:var(--surface); color:var(--ink-2); font-weight:500; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-deep)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-mid);color:#184f95}
.btn.danger{color:var(--crit)}
.syncpill{
  font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
  color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
}
.syncpill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.syncpill.s-saved{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--rule))}
.syncpill.s-saving{color:var(--accent);border-color:var(--accent-mid)}
.syncpill.s-offline,.syncpill.s-blocked{color:var(--crit);border-color:var(--clash-bd);background:var(--clash-bg);font-weight:600}
.syncpill.s-conflict{color:var(--amber-fg);border-color:var(--amber-bd);background:var(--amber-bg)}
@media (max-width:860px){ .syncpill{font-size:10px;padding:2px 7px} }

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:16px;padding:16px;align-items:start;max-width:1720px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--rule)}
.panel-h h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.panel-h .spacer{margin-left:auto}
.panel-h .chev{display:none}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:11px 13px 12px}
.tile .lab{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:1px;line-height:1.1}
.tile .val .of{font-size:14px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.tile .note{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.tile.alert .val{color:var(--crit)}
.tile.warnt .val{color:var(--warn-fg)}
.tile.clear .val{color:var(--good)}
.meter{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .18s ease}
.meter.over>i{background:var(--warn)}
.meter.done>i{background:var(--good)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.dow{
  padding:7px 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;background:var(--surface-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:5;
}
.dow.we{color:var(--brand-deep);background:var(--brand-soft)}
.day{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface);min-height:150px;padding:0 0 5px}
.day.out{background:var(--surface-2);opacity:.55}
.day.we{background:color-mix(in srgb, var(--brand-soft) 22%, var(--surface))}
.day-h{display:flex;align-items:center;gap:6px;padding:5px 8px 4px;border-bottom:1px dotted var(--rule);position:relative}
.day-n{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:0 3px;border-radius:5px;line-height:1.25}
button.day-n:hover{background:var(--brand-soft);color:var(--brand-deep)}
button.day-n.custom{box-shadow:inset 0 -2px 0 var(--accent)}
.dayslots{display:flex;flex-direction:column;gap:4px}
.dayslot{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid var(--rule);border-radius:9px;padding:7px 10px;font-size:12.5px;color:var(--ink-3);
}
.dayslot:hover{border-color:var(--brand-mid);background:var(--brand-soft)}
.dayslot.on{border-color:var(--accent-mid);background:var(--accent-soft);color:var(--ink)}
.dayslot.on.noc .ds-name{color:var(--accent-deep);font-weight:600}
.ds-l{display:flex;align-items:center;gap:8px;min-width:0}
.ds-mark{font-size:12px;color:var(--accent)}
.dayslot:not(.on) .ds-mark{color:var(--line)}
.ds-name{font-weight:500}
.ds-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex:none}
.ds-doc{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--ring);color:var(--ink)}
.ds-doc[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .ds-doc[style*="--tint"]{background:var(--tint-dark);color:var(--ink)}
.ds-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-deep);
  background:var(--accent-soft);border-radius:4px;padding:1px 5px}
.day.today .day-n{background:var(--brand);color:#fff;border-radius:6px;padding:0 6px;margin-left:-4px}
.day-dow{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:none}
.day-cnt{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day-cnt.short{color:var(--crit);font-weight:600}
.off-line{
  display:flex;flex-wrap:wrap;align-items:center;gap:3px;
  padding:3px 7px 4px;border-bottom:1px dotted var(--rule);
}
.off-line b{font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.07em;margin-right:1px}
.offchip{
  font-size:10px;font-weight:700;color:var(--amber-fg);background:var(--amber-bg);
  border:1px solid var(--amber-bd);border-radius:4px;padding:0 4px;line-height:15px;
}
.offchip:hover{filter:brightness(1.08) saturate(1.1)}
.offchip.clash{background:var(--clash-bg);border-color:var(--clash-bd);color:var(--clash-fg)}
.offchip.clash:hover{filter:brightness(1.08) saturate(1.1)}
.offadd{
  font-size:11px;color:var(--ink-3);border:1px dashed var(--line);
  border-radius:4px;padding:0 5px;line-height:15px;
}
.offadd:hover{color:var(--brand-deep);border-color:var(--brand-mid);background:var(--brand-soft)}
.day.out .off-line{display:none}
/* Spike 3 lane — one slim band per week, deliberately quieter than a shift row */
.spklane{
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--spk-soft);min-height:19px;padding:1px 5px;
  display:flex;align-items:center;gap:3px;flex-wrap:wrap;text-align:left;width:100%;
}
.spklane.out{background:var(--surface-2);opacity:.45;pointer-events:none}
.spklane.bare{min-height:13px}
.spklane:hover{background:var(--spk-hover)}
.spkchip{
  font-size:9px;font-weight:700;line-height:1.35;color:var(--spk);white-space:nowrap;
  display:inline-flex;align-items:center;gap:3px;
}
.spkchip .tm{font-weight:400;opacity:.85;font-variant-numeric:tabular-nums}
.spkchip.open{color:var(--ink-3)}
.spkchip.open .tm{opacity:.7}
.spkchip + .spkchip{padding-left:4px;border-left:1px solid var(--spk-mid)}
.spkdash{font-size:9px;color:var(--spk-mid)}
.spkinline{display:none}
.spkcard{border:1px solid var(--rule);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--surface)}
.spkrow{display:flex;align-items:center;gap:7px}
.spkrow select{font-size:12.5px;padding:5px 7px}
.spktime{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--rule)}
.spktime input[type=text]{flex:1}
.spktime .hint{flex:none;font-size:11px}
.spktime .btn{flex:none;padding:1px 7px}

.slot{display:flex;align-items:center;gap:5px;padding:2px 7px;min-height:25px}
.slot .t{font-size:10px;color:var(--ink-3);width:60px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .chip[style*="--tint"]{background:var(--tint-dark);color:var(--ink)}
.dot[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .dot[style*="--tint"]{background:var(--tint-dark)}
.pick .ini[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .pick .ini[style*="--tint"]{background:var(--tint-dark);color:var(--ink)}
.chip{
  flex:1; min-width:0; display:flex; align-items:center; gap:5px;
  border-radius:6px; padding:3px 7px; font-size:12px; font-weight:600;
  border:1px solid var(--ring); background:var(--surface-2); color:var(--ink);
  text-align:left; position:relative; overflow:hidden;
}
.chip:hover{outline:2px solid var(--accent-mid);outline-offset:-1px}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.open{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 5px,var(--hatch) 5px,var(--hatch) 10px);color:var(--ink-3);font-weight:500;border-style:dashed;border-color:var(--line)}
.chip.open:hover{color:var(--ink-2)}
.chip.hard{box-shadow:inset 0 0 0 2px var(--crit)}
.chip.soft{box-shadow:inset 0 0 0 2px var(--warn)}
.slot{align-items:flex-start}
.slot .t{padding-top:4px}
.cellcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nerdline{display:flex;flex-wrap:wrap;gap:3px;padding-left:2px}
.nerdchip{
  font-size:9.5px;font-weight:700;letter-spacing:.02em;line-height:1.15;
  color:var(--nerd);background:var(--nerd-soft);border:1px dashed var(--nerd-mid);
  border-radius:5px;padding:2px 5px;
}
.nerdchip:hover{border-style:solid}
.nerdadd{
  font-size:9.5px;color:var(--ink-3);border:1px dashed var(--line);border-radius:5px;
  padding:2px 5px;line-height:1.15;display:none;
}
.slot:hover .nerdadd,.nerdadd:focus-visible{display:inline-block}
.nerdadd:hover{color:var(--nerd);border-color:var(--nerd-mid);background:var(--nerd-soft)}
/* touch devices use the picker's own NERD button instead of a hover affordance */
@media (hover:none){ .slot:hover .nerdadd{display:none} }
.flag{margin-left:auto;font-size:10px;font-weight:700;flex:none;line-height:1}
.flag.h{color:var(--crit)}
.flag.s{color:var(--warn-fg)}
.slot.noc .t{color:var(--accent-deep);font-weight:600}

/* armed placement mode */
body.armed .chip.open{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
body.armed .chip:not(.open){opacity:.75}
body.armed .chip.open.noarm{border-color:var(--rule);background:var(--surface);color:var(--ink-3);opacity:.5}
.armbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;
  background:var(--brand);color:#fff;border-radius:999px;padding:9px 12px 9px 14px;
  display:none;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;
}
body.armed .armbar{display:flex}
.armbar .x{background:rgba(255,255,255,.16);border-radius:999px;width:22px;height:22px;color:#fff;font-size:14px;line-height:1}

/* ---------- roster panel ---------- */
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{
  text-align:right;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:7px 6px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
.rtable th:first-child{text-align:left}
.rtable td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.rtable td:first-child{text-align:left}
.rtable tr:last-child td{border-bottom:none}
.rtable tr.picked td{background:var(--brand-soft)}
.rtable tbody tr:hover td{background:var(--surface-2)}
.rname{display:flex;align-items:center;gap:7px;width:100%}
.dot{width:9px;height:9px;border-radius:3px;flex:none;border:1px solid var(--ring)}
.rname .ini{font-weight:600}
.rname .noc-b{font-size:9px;color:var(--accent-deep);background:var(--accent-soft);border-radius:3px;padding:1px 3px;font-weight:700;letter-spacing:.03em}
.cell-meter{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cell-meter .m{width:46px;height:5px;border-radius:3px;background:var(--accent-soft);overflow:hidden;flex:none}
.cell-meter .m>i{display:block;height:100%;background:var(--accent)}
.cell-meter .m.over>i{background:var(--warn)}
.cell-meter .m.done>i{background:var(--good)}
.num.under{color:var(--crit);font-weight:600}
.num.over{color:var(--warn-fg);font-weight:600}

<script>
"use strict";

const APP_VERSION = "1.11.0";
const APP_BUILT   = "2026-09-04";

/* ============================================================
   1. MODEL
   ============================================================ */

const SLOTS = {
  ins:  {label:"6a–6p ins",   start:6,  len:12, kind:"day"},
  outs: {label:"6a–6p outs",  start:6,  len:12, kind:"day"},
  d8:   {label:"8a–8p",       start:8,  len:12, kind:"day"},
  d10:  {label:"10a–10p",     start:10, len:12, kind:"day"},
  d12:  {label:"12p–12a",     start:12, len:12, kind:"day"},
  d14:  {label:"2p–2a",       start:14, len:12, kind:"late"},
  spk3: {label:"4p–10p SPK3", start:16, len:6,  kind:"day"},
  d16:  {label:"4p–2a",       start:16, len:10, kind:"late"},
  noc:  {label:"6p–6a",       start:18, len:12, kind:"night", overnight:true},
  // Spike 3 never appears in a coverage template — it is scheduled per day with
  // its own hours — but it needs an entry here so rule messages can name it.
  spk:  {label:"Spike 3",     start:14, len:6,  kind:"late", spike:true},
};
// Weekday shape, derived from the Nov 2025 – Nov 2026 master schedule.
const TEMPLATE = {
  0:["ins","outs","d10","d12","d16","noc"],  // Sunday  — 6
  1:["ins","outs","d10","d14","noc"],        // Monday  — 5
  2:["ins","d8","d14","noc"],                // Tuesday — 4
  3:["ins","d8","d14","noc"],                // Wednesday
  4:["ins","d8","d14","noc"],                // Thursday
  5:["ins","outs","d10","d12","d16","noc"],  // Friday  — 6
  6:["ins","outs","d10","d12","d16","noc"],  // Saturday— 6
};
const SLOT_ORDER = ["ins","outs","d8","d10","d12","d14","spk3","d16","noc"];

/* NERDs — New Emergency Room Doctors. They shadow whoever holds a shift rather
   than being scheduled onto it, so they never affect coverage, targets or rules.
   Two placement limits of their own: never a Wednesday, and on Tuesdays only the
   6a–6p and 8a–8p shifts. */
/* Spike 3 — a triage doctor who does not see cases. Scheduled per day from a
   list of times you define, so odd hours need no new row in the grid. They are
   a doctor being scheduled, so the hard rules apply; they are not coverage, so
   the day's count ignores them. */
const SEED_SPIKE_TIMES = [
  {id:"s1", label:"2p–8p",  start:14, end:20},
  {id:"s2", label:"4p–10p", start:16, end:22},
];
const spikeTimes = ()=> (S.spikeTimes && S.spikeTimes.length) ? S.spikeTimes : SEED_SPIKE_TIMES;
const spikeTime = id => spikeTimes().find(t=>t.id===id) || spikeTimes()[0];
const spikeOn = ds => (S.spike||{})[ds] || [];
const docSpike = (ds,id) => spikeOn(ds).find(e=>e.doc===id) || null;
function spikeStartHour(ds, id){
  const e = docSpike(ds,id);
  return e ? (spikeTime(e.t)||{start:14}).start : 14;
}
function addSpike(ds, timeId, doc){
  S.spike = S.spike || {};
  const list = S.spike[ds] = (S.spike[ds]||[]).slice();
  list.push({t:timeId, doc:doc||null});
  S.spike[ds] = list;
}
function setSpikeDoc(ds, idx, doc){
  const list = (S.spike||{})[ds]; if(!list || !list[idx]) return;
  list[idx] = {...list[idx], doc:doc||null};
}
function setSpikeTime(ds, idx, timeId){
  const list = (S.spike||{})[ds]; if(!list || !list[idx]) return;
  list[idx] = {...list[idx], t:timeId};
}
function removeSpike(ds, idx){
  const list = (S.spike||{})[ds]; if(!list) return;
  list.splice(idx,1);
  if(!list.length) delete S.spike[ds];
}
function spikeCounts(y,m){
  const out = {};
  for(const ds of monthDays(y,m))
    for(const e of spikeOn(ds)) if(e.doc) out[e.doc]=(out[e.doc]||0)+1;
  return out;
}

const NERD_TUESDAY_SLOTS = ["ins","outs","d8"];
function nerdAllowed(dateStr, slot){
  const w = dowOf(dateStr);
  if(w===3) return {ok:false, why:"NERDs are not scheduled on Wednesdays"};
  if(w===2 && !NERD_TUESDAY_SLOTS.includes(slot))
    return {ok:false, why:"On Tuesdays NERDs only work 6a–6p or 8a–8p"};
  return {ok:true};
}
const activeNerds = ()=> (S.nerds||[]).filter(n=>n.active!==false);
const nerdById = id => (S.nerds||[]).find(n=>n.id===id) || null;
const nerdsOn = (ds, slot)=> ((S.nerdAssign||{})[ds]||{})[slot] || [];
function nerdDayShifts(ds, id){
  const day = (S.nerdAssign||{})[ds] || {};
  return Object.keys(day).filter(k=>(day[k]||[]).includes(id));
}
function setNerd(ds, slot, id, on){
  S.nerdAssign = S.nerdAssign || {};
  const day = S.nerdAssign[ds] = S.nerdAssign[ds] || {};
  const list = day[slot] = (day[slot] || []).slice();
  const i = list.indexOf(id);
  if(on && i<0) list.push(id);
  if(!on && i>=0) list.splice(i,1);
  day[slot] = list;
  if(!list.length) delete day[slot];
  if(!Object.keys(day).length) delete S.nerdAssign[ds];
}
function clearNerds(ds, slot){
  const day = (S.nerdAssign||{})[ds];
  if(!day) return;
  delete day[slot];
  if(!Object.keys(day).length) delete S.nerdAssign[ds];
}
// count across the month currently in view
function nerdCounts(y,m){
  const out = {};
  activeNerds().forEach(n=> out[n.id]=0);
  for(const ds of monthDays(y,m)){
    const day = (S.nerdAssign||{})[ds] || {};
    for(const slot in day) for(const id of day[slot]) if(out[id]!==undefined) out[id]++;
  }
  return out;
}
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Default shift preferences, ordered most-wanted first. Seeded from what each
// doctor actually worked across Nov 2025 – Nov 2026, so the ranking starts from
// real behaviour rather than blank. Soft weighting only — never a rule.
const SEED_PREFS = {
  MG:["ins","d12","outs","d14","d8","d10","d16","spk3","noc"],
  SR:["ins","outs","d10","d8","d12","d14","spk3","d16","noc"],
  CB:["noc","d14","d12","d16","d10","d8","ins","outs","spk3"],
  RL:["noc","d14","d16","d12","d10","ins","outs","d8","spk3"],
  KF:["d14","d16","noc","ins","d10","d12","d8","outs","spk3"],
  CL:["d14","noc","d12","d10","ins","d8","d16","outs","spk3"],
  CD:["outs","ins","d8","d10","spk3","d14","d12","d16","noc"],
  MN:["ins","d8","outs","d10","d14","d12","spk3","d16","noc"],

const WHO_LABEL = {all:"every doctor", dayonly:"doctors who do not work overnights", night:"doctors who work overnights"};
function whoMatches(rule, doc){
  if(rule.who==="all") return true;
  if(rule.who==="dayonly") return !doc.nightOK;
  if(rule.who==="night") return !!doc.nightOK;
  return doc.id===rule.who;
}
function quotaMatches(rule, ds, slot){
  const w = rule.what||{};
  if(w.type==="weekday") return dowOf(ds)===w.weekday;
  if(w.type==="slot")    return slot===w.slot;
  return true;                                  // any shift
}
function quotaLabel(rule){
  const w = rule.what||{};
  const unit = w.type==="weekday" ? `${DOW[w.weekday]}s`
             : w.type==="slot"    ? SLOTS[w.slot].label
             : "shifts";
  const verb = rule.kind==="min" ? "must work at least" : "must not work more than";
  const whoTxt = WHO_LABEL[rule.who] || (docById(rule.who) ? rule.who : rule.who);
  return `${whoTxt} ${verb} ${rule.count} ${unit} a month`;
}
const activeQuotas = ()=> (S.rules.quotas||[]).filter(q=>q.on!==false);
// "Early" means the shift starts before noon — the ones you cannot flip straight

function load(){
  try{

    if(!raw) return blankState();
    const s = JSON.parse(raw);
    s.rules = {...DEFAULT_RULES, ...(s.rules||{})};

    s.nerds = s.nerds||[]; s.nerdAssign = s.nerdAssign||{};
    s.spike = s.spike||{};
    if(!Array.isArray(s.spikeTimes) || !s.spikeTimes.length)
      s.spikeTimes = SEED_SPIKE_TIMES.map(t=>({...t}));
    // migrate: earlier versions had no preference list
    s.roster.forEach(d=>{
      if(!Array.isArray(d.prefs) || !d.prefs.length)
        d.prefs = (SEED_PREFS[d.initials]||SLOT_ORDER).slice();
      if(d.blockPref===undefined) d.blockPref = SEED_BLOCK[d.initials]||0;
    });
    if(!Array.isArray(s.rules.quotas)){                // pre-editable-rules saves
      s.rules.quotas = [];
      const add=(id,count,what,who)=>{ if(count>0) s.rules.quotas.push({id,on:true,kind:"min",count,what,who}); };
      add("sat", s.rules.minSat, {type:"weekday",weekday:6}, "all");
      add("sun", s.rules.minSun, {type:"weekday",weekday:0}, "all");
      add("ins", s.rules.minInsDayOnly, {type:"slot",slot:"ins"}, "dayonly");
    }
    ["onPto","onNight","onOneADay","onRecovery"].forEach(k=>{ if(s.rules[k]===undefined) s.rules[k]=true; });
    if(s.rules.nightToEarlyDays!==undefined){          // pre-step-down saves
      s.rules.nightEarlyDays = s.rules.nightToEarlyDays;
      if(s.rules.nightOffDays===undefined) s.rules.nightOffDays = 2;
      delete s.rules.nightToEarlyDays;
    }

/* ============================================================
   1b. PERSISTENCE
   Two layers. The browser keeps a copy so the board works offline and feels
   instant; when a Supabase project is configured the schedule also lives
   there, which is what makes it survive a new device and reach other people.
   View and theme stay local — those are yours, not the team's.
   ============================================================ */

const SHARED_KEYS = ["roster","pto","schedule","months","days","nerds","nerdAssign",
                     "spike","spikeTimes","rules"];
const sharedOf = st => { const o={}; SHARED_KEYS.forEach(k=>o[k]=st[k]); return o; };

const Cloud = {
  cfg:null,            // {url, key, table, id}
  version:0,
  lastPushed:null,     // guards against re-sending an unchanged payload
  status:"local",      // local | saving | saved | offline | conflict | readonly
  lastError:"",
  pollT:null,
  get on(){ return !!(this.cfg && this.cfg.url && this.cfg.key); },
  headers(extra){
    return Object.assign({
      "apikey": this.cfg.key,
      "Authorization": "Bearer "+this.cfg.key,
      "Content-Type": "application/json",
    }, extra||{});
  },
  rowUrl(q){
    const t = encodeURIComponent(this.cfg.table||"schedules");
    return `${this.cfg.url.replace(/\/+$/,"")}/rest/v1/${t}?id=eq.${encodeURIComponent(this.cfg.id||"default")}${q||""}`;
  },
  async fetchRow(){
    const r = await fetch(this.rowUrl("&select=*"), {headers:this.headers()});
    if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json();
    return rows[0] || null;
  },
  async createRow(){
    const t = encodeURIComponent(this.cfg.table||"schedules");
    const r = await fetch(`${this.cfg.url.replace(/\/+$/,"")}/rest/v1/${t}`, {
      method:"POST",
      headers:this.headers({"Prefer":"return=representation"}),
      body:JSON.stringify({id:this.cfg.id||"default", version:1, data:sharedOf(S)}),
    });
    if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json();
    this.version = (rows[0]||{}).version || 1;
    return rows[0];
  },
  // Optimistic locking: the update only lands if nobody has written since we read.
  async push(){
    if(!this.on) return;
    const payload = JSON.stringify(sharedOf(S));
    if(payload === this.lastPushed){ setSync("saved"); return; }
    setSync("saving");
    try{
      const r = await fetch(this.rowUrl(`&version=eq.${this.version}`), {
        method:"PATCH",
        headers:this.headers({"Prefer":"return=representation"}),
        body:JSON.stringify({version:this.version+1, data:sharedOf(S),
                             updated_at:new Date().toISOString()}),
      });
      if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      const rows = await r.json();
      if(!rows.length){ await this.resolveConflict(); return; }
      this.version = rows[0].version;
      this.lastPushed = payload;
      setSync("saved");
    }catch(e){
      this.lastError = String(e.message||e);
      setSync("offline");
    }
  },
  async resolveConflict(){
    try{
      const row = await this.fetchRow();
      if(row){
        adoptShared(row.data);
        this.version = row.version;
        setSync("conflict");
        flashBlock("Someone else saved a change — the board has been refreshed to their version");
        render();
      }
    }catch(e){ setSync("offline"); }
  },
  async pull({adopt=true}={}){
    if(!this.on) return null;
    try{
      let row = await this.fetchRow();
      if(!row) row = await this.createRow();
      if(row && adopt && row.version !== this.version){
        adoptShared(row.data);
        this.version = row.version;
        render();
      } else if(row){ this.version = row.version; this.lastPushed = JSON.stringify(row.data); }
      setSync("saved");
      return row;
    }catch(e){
      this.lastError = String(e.message||e);
      setSync("offline");
      return null;
    }
  },
  startPolling(){
    clearInterval(this.pollT);
    if(!this.on) return;
    this.pollT = setInterval(()=>{ if(!pendingPush) this.pull(); }, 12000);
  },
};

function adoptShared(data){
  if(!data) return;
  SHARED_KEYS.forEach(k=>{ if(data[k]!==undefined) S[k]=data[k]; });
  S.rules = {...DEFAULT_RULES, ...(S.rules||{})};
  normaliseRoster(S);
  Cloud.lastPushed = JSON.stringify(sharedOf(S));   // already what the server holds
  saveLocal();
}
function normaliseRoster(st){
  (st.roster||[]).forEach(d=>{
    if(!Array.isArray(d.prefs) || !d.prefs.length)
      d.prefs = (SEED_PREFS[d.initials]||SLOT_ORDER).slice();
    if(d.blockPref===undefined) d.blockPref = SEED_BLOCK[d.initials]||0;
  });
}

let storageBlocked = false;
function saveLocal(){
  try{
    localStorage.setItem("shiftBoard.v1", JSON.stringify(S));
    if(storageBlocked){ storageBlocked=false; setSync(Cloud.on?Cloud.status:"local"); }
  }catch(e){
    // Sandboxed previews and some private modes refuse storage outright. Say so
    // rather than silently dropping the month.
    storageBlocked = true;
    setSync("blocked");
  }
}

let saveT=null, pendingPush=false;
function save(){
  clearTimeout(saveT);
  pendingPush = true;
  saveT=setTimeout(async ()=>{
    saveLocal();
    if(Cloud.on) await Cloud.push();
    pendingPush = false;
  },600);
}

const SYNC_TEXT = {
  local:    ["Saved on this device", "This browser only — set up sharing in Data"],
  saving:   ["Saving…", ""],
  saved:    ["Saved for everyone", ""],
  offline:  ["Not syncing", "Changes are held on this device"],
  conflict: ["Refreshed", "Someone else saved first"],
  blocked:  ["Not saving", "This browser is blocking storage — export a backup"],

/* ============================================================
   2. DATE + LOOKUP HELPERS
   ============================================================ */

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d);};
const dowOf=s=>fromIso(s).getDay();
const fmtShort=s=>{const d=fromIso(s);return `${DOW3[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;};

const monthKey = (y,m)=> `${y}-${pad(m+1)}`;
// A month may override the standard weekday shape (November's extra 12p-12a, say).
function templateFor(y,m){
  const o = S.months[monthKey(y,m)];
  return (o && o.tpl) ? o.tpl : TEMPLATE;
}
// A single date can override its month, which in turn can override the standard
// weekday shape. Most specific wins.
function slotsFor(dateStr){
  const own = (S.days||{})[dateStr];
  if(own) return SLOT_ORDER.filter(k=>own.includes(k));
  const d = fromIso(dateStr);
  const tpl = templateFor(d.getFullYear(), d.getMonth());
  const set = new Set(tpl[d.getDay()] || []);
  return SLOT_ORDER.filter(k=>set.has(k));
}
const dayIsCustom = ds => !!(S.days||{})[ds];
// What this date would run if it had no override of its own.
function monthShapeFor(dateStr){
  const d = fromIso(dateStr);
  const tpl = templateFor(d.getFullYear(), d.getMonth());
  const set = new Set(tpl[d.getDay()] || []);
  return SLOT_ORDER.filter(k=>set.has(k));
}
function setDaySlots(dateStr, list){
  S.days = S.days || {};
  const base = monthShapeFor(dateStr);
  const next = SLOT_ORDER.filter(k=>list.includes(k));
  if(next.length===base.length && next.every((k,i)=>k===base[i])) delete S.days[dateStr];
  else S.days[dateStr] = next;
}
// A working copy of the current month's shape, created on first edit.
function ensureMonthTpl(y,m){
  const k = monthKey(y,m);
  if(!S.months[k]) S.months[k] = {};
  if(!S.months[k].tpl){
    S.months[k].tpl = {};
    for(let w=0;w<7;w++) S.months[k].tpl[w] = TEMPLATE[w].slice();
  }
  return S.months[k].tpl;
}
const docById = id => S.roster.find(d=>d.id===id) || null;
const activeRoster = () => S.roster.filter(d=>d.active);

function assign(dateStr, slot, id){
  if(!S.schedule[dateStr]) S.schedule[dateStr] = {};
  if(id) S.schedule[dateStr][slot] = id;
  else { delete S.schedule[dateStr][slot]; clearNerds(dateStr, slot); }
  if(!Object.keys(S.schedule[dateStr]).length) delete S.schedule[dateStr];
  save();
}
const at = (dateStr, slot) => (S.schedule[dateStr]||{})[slot] || null;
function shiftsOn(dateStr, id){
  const day = S.schedule[dateStr]||{};
  const out = Object.keys(day).filter(k=>day[k]===id);
  if(docSpike(dateStr,id)) out.push("spk");   // counts for the rules, not for coverage
  return out;
}
function isPTO(id, dateStr){ return !!(S.pto[id]||[]).includes(dateStr); }

function monthDays(y,m){
  const out=[]; const d=new Date(y,m,1);
  while(d.getMonth()===m){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
// Full grid including leading/trailing days so weeks are whole.
function gridDays(y,m){
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  const end=new Date(last); end.setDate(last.getDate()+(6-last.getDay()));
  const out=[]; const d=new Date(start);
  while(d<=end){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* ============================================================
   3. RULE ENGINE
   Hard rules block placement. Soft rules warn.
   ============================================================ */

function consecutiveNightsIfPlaced(id, dateStr){
  let n=1, c=dateStr;
  while(true){ c=addDays(c,-1); if(at(c,"noc")===id) n++; else break; }
  c=dateStr;
  while(true){ c=addDays(c,1); if(at(c,"noc")===id) n++; else break; }
  return n;
}
function consecutiveDaysIfPlaced(id, dateStr){
  const worked = s => shiftsOn(s,id).length>0;
  let n=1, c=dateStr;
  while(true){ c=addDays(c,-1); if(worked(c)) n++; else break; }
  c=dateStr;
  while(true){ c=addDays(c,1); if(worked(c)) n++; else break; }
  return n;
}

// Hard rules. Deliberately free of any month-wide aggregate so the solver can
// call this hundreds of thousands of times without recomputing stats().
function hardCheck(id, dateStr, slot, ignoreSelf){
  const doc = docById(id); const out=[];
  if(!doc) return out;
  const sl = SLOTS[slot];

  if(S.rules.onPto!==false && isPTO(id,dateStr))
    out.push({level:"hard", code:"pto", msg:`${id} requested ${fmtShort(dateStr)} off`});

  if(S.rules.onNight!==false && sl.overnight && !doc.nightOK)
    out.push({level:"hard", code:"night", msg:`${id} does not work overnights`});

  const already = S.rules.onOneADay===false ? []
    : shiftsOn(dateStr,id).filter(k=> ignoreSelf===false ? true : k!==slot);
  if(already.length)
    out.push({level:"hard", code:"double", msg:`${id} already has ${SLOTS[already[0]].label} on ${fmtShort(dateStr)}`});

  /* Coming off overnights, recovery steps down rather than switching on:
       days 1-2  no shift at all
       day 3     back on, but nothing starting before noon
       day 4+    anything
     Consecutive overnights are untouched — the clock starts at the last night
     of a run, not the first. */
  const rec = S.rules.onRecovery!==false;
  const off = rec ? (S.rules.nightOffDays|0) : 0, early = rec ? (S.rules.nightEarlyDays|0) : 0;

  if(!sl.overnight){
    let flagged = false;
    for(let k=1;k<=off;k++){
      if(at(addDays(dateStr,-k),"noc")===id){
        out.push({level:"hard", code:"nightrec",
          msg:`${id} worked the overnight ${fmtShort(addDays(dateStr,-k))} — the ${off} days after are fully off`});
        flagged = true; break;
      }
    }
    if(!flagged && isEarly(slot)){
      for(let k=off+1;k<=early;k++){
        if(at(addDays(dateStr,-k),"noc")===id){
          out.push({level:"hard", code:"nightearly",
            msg:`${id} came off an overnight ${fmtShort(addDays(dateStr,-k))} — nothing starting before noon until day ${early+1}`});
          break;
        }
      }
    }
  }

  // Same rule looking forward, so you cannot drop a night in front of a shift
  // the doctor already holds.
  if(sl.overnight){
    for(let k=1;k<=Math.max(off,early);k++){
      const nx = addDays(dateStr,k), day = S.schedule[nx]||{};
      if(day.noc===id) break;                    // run continues; the later night governs
      const held = Object.keys(day).filter(x=>day[x]===id);
      if(!held.length) continue;
      if(k<=off){
        out.push({level:"hard", code:"nightrec",
          msg:`${id} is on ${SLOTS[held[0]].label} ${fmtShort(nx)}, inside the ${off} days off after an overnight`});
        break;
      }
      const e = held.filter(x=>isEarlyAt(nx, id, x));
      if(e.length){
        out.push({level:"hard", code:"nightearly",
          msg:`${id} is on ${SLOTS[e[0]].label} ${fmtShort(nx)}, too early after an overnight`});
        break;
      }
    }
  }
  return out;
}
const hardOK = (id,ds,slot)=> hardCheck(id,ds,slot,true).length===0;

// Soft rules that depend only on neighbouring days, not on month totals.
function softCheck(id, dateStr, slot){
  const doc = docById(id); const out=[];
  if(!doc) return out;
  const sl = SLOTS[slot], w = dowOf(dateStr);

  for(const r of (doc.restrictions||[])){
    if(!r.days.includes(w)) continue;
    if(r.slots==="all" || (r.slots==="late" && (sl.kind==="late"||sl.kind==="night"))){
      const what = r.slots==="late" ? `late ${DOW[w]}s` : `${DOW[w]}s`;
      out.push({level:"soft", code:"restrict", msg:`${id} does not take ${what}`});
    }
  }
  if(sl.overnight){
    const n = consecutiveNightsIfPlaced(id,dateStr);
    if(n > S.rules.maxConsecNights)
      out.push({level:"soft", code:"consecnight", msg:`${n} overnights in a row for ${id} (cap ${S.rules.maxConsecNights})`});
  }
  const cd = consecutiveDaysIfPlaced(id,dateStr);
  if(cd > S.rules.maxConsecDays)
    out.push({level:"soft", code:"consecday", msg:`${cd} days worked in a row for ${id} (cap ${S.rules.maxConsecDays})`});
  return out;
}

// Where in a doctor's ranking this shift sits. 1 = top choice, 0 = last.
function prefRank(doc, slot){
  const p = doc.prefs || [];
  const i = p.indexOf(slot);
  if(i < 0) return 0.5;
  return p.length<2 ? 1 : 1 - i/(p.length-1);
}

// Returns [{level:"hard"|"soft", code, msg}] — the full picture, for the UI.
function checkPlacement(id, dateStr, slot, {ignoreSelf=true}={}){
  const doc = docById(id);
  if(!doc) return [];
  const out = [...hardCheck(id,dateStr,slot,ignoreSelf), ...softCheck(id,dateStr,slot)];
  if(S.rules.warnOverTarget){
    const st = stats()[id];
    if(st){
      const cur = at(dateStr,slot)===id ? st.shifts : st.shifts+1;
      if(cur > doc.target)
        out.push({level:"soft", code:"overtarget", msg:`puts ${id} at ${cur} of ${doc.target} preferred`});
    }
  }
  return out;
}

/* ============================================================
   3b. AUTO-FILL
   A local solver, not a language model — it enumerates every open slot and
   scores every legal doctor for it. Hard rules are absolute: a slot is left
   OPEN rather than filled illegally.
   ============================================================ */

const WEIGHTS = {
  need:        12,   // per shift still owed against their preferred total
  overshoot:  -55,   // flat penalty once a doctor is at or past target
  pref:        34,   // full weight of a top-ranked shift type
  wkndEquity:  -7,   // per weekend shift above the roster average
  ovnEquity:   -5,   // per overnight above the average of night-eligible docs
  restrict:   -45,   // blocked weekday
  consecNight:-28,
  consecDay:  -20,
  otherSoft:  -10,
  continuity:  10,   // same slot as yesterday — real schedules run in blocks
  longRun:     -8,   // per day beyond 3 worked in a row
  sameType:    -7,   // per repeat of one slot type past that doctor's allowance,
                     // so nobody spends a whole month on a single shift
  quota:       70,   // per outstanding monthly minimum this slot would satisfy
  blockKeep:   22,   // extending a run toward the length this doctor likes
  blockOver:  -18,   // per day past it
  blockLone:  -14,   // an isolated single shift for someone who prefers runs
};
const workedDay = (id, ds)=> shiftsOn(ds,id).length>0;
// Some doctors want 3 or 4 shifts together then a proper break; others want
// them spread out one at a time. blockPref is that number, 0 for no preference.
function clusterScore(doc, ds){
  const P = doc.blockPref|0;
  if(!P) return 0;
  const before = workedDay(doc.id, addDays(ds,-1));
  const after  = workedDay(doc.id, addDays(ds,1));
  if(P === 1) return (before||after) ? WEIGHTS.blockOver : 0;
  const run = consecutiveDaysIfPlaced(doc.id, ds);
  if(run > P) return (run-P) * WEIGHTS.blockOver;
  return (before||after) ? WEIGHTS.blockKeep : WEIGHTS.blockLone;
}
// How many of one shift type a doctor can take before repetition starts costing.
// Scales with how highly they rank it, so a dedicated nocturnist still gets
// nights while a generalist gets a spread.
function sameTypeAllowance(doc, slot){
  const strong = S.rules.prefStrength==="strong";
  return 2 + Math.round(prefRank(doc,slot)*5) + (SLOTS[slot].overnight ? 3 : 0) + (strong?4:0);
}

function autofill({mode="open", allowOvershoot=true} = {}){
  const y=S.view.y, m=S.view.m;
  const days = monthDays(y,m);
  const roster = activeRoster();
  if(!roster.length) return {filled:0, open:0, cleared:0, unfilled:[], before:0};

  let cleared = 0;
  if(mode==="rebuild"){
    for(const ds of days){
      for(const slot of slotsFor(ds)) if(at(ds,slot)){ assign(ds,slot,null); cleared++; }
    }
  }

  // live counters, so the scorer never has to recompute month aggregates
  const cnt = {};
  const QR = activeQuotas();
  roster.forEach(d=> cnt[d.id]={shifts:0,wknd:0,ovn:0,byType:{},q:{}});
  for(const ds of days){
    const isW = S.rules.weekendDays.includes(dowOf(ds)), w = dowOf(ds);
    for(const slot of slotsFor(ds)){
      const id = at(ds,slot);
      if(!id || !cnt[id]) continue;
      const c = cnt[id];
      c.shifts++; if(isW) c.wknd++; if(SLOTS[slot].overnight) c.ovn++;
      for(const r of QR) if(quotaMatches(r,ds,slot)) c.q[r.id]=(c.q[r.id]||0)+1;
      c.byType[slot] = (c.byType[slot]||0)+1;
    }
  }
  const before = Object.values(cnt).reduce((a,b)=>a+b.shifts,0);

  // every empty slot, hardest to staff first: overnights, then weekends, then
  // whichever slot type has the fewest eligible doctors overall
  const eligibleCount = {};
  for(const k of SLOT_ORDER)
    eligibleCount[k] = roster.filter(d=> !SLOTS[k].overnight || d.nightOK).length;

  const todo = [];
  for(const ds of days){
    const isW = S.rules.weekendDays.includes(dowOf(ds));
    for(const slot of slotsFor(ds)){
      if(at(ds,slot)) continue;
      todo.push({ds, slot, isW,
        rank: (SLOTS[slot].overnight?0:1)*100 + eligibleCount[slot] + (isW?0:5) });
    }
  }
  todo.sort((a,b)=> a.rank-b.rank || a.ds.localeCompare(b.ds) || SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot));

  // "strong" leans hard on each doctor's ranking, which reproduces specialists
  // (a nocturnist taking most of the nights). "balanced" spreads the load.
  const K = S.rules.prefStrength==="strong" ? {pref:2.9, equity:0.4} : {pref:1, equity:1};
  const nightDocs = roster.filter(d=>d.nightOK).length || 1;
  const totalSlots = days.reduce((n,ds)=>n+slotsFor(ds).length, 0);
  const wkndSlots  = days.filter(ds=>S.rules.weekendDays.includes(dowOf(ds)))
                         .reduce((n,ds)=>n+slotsFor(ds).length,0);
  const ovnSlots   = days.length;
  const avgWknd = wkndSlots/roster.length;
  const avgOvn  = ovnSlots/nightDocs;

  function score(doc, ds, slot, isW, strictMax){
    if(!hardOK(doc.id, ds, slot)) return null;
    // a maximum is respected outright unless the slot would otherwise stay open
    if(strictMax && quotaOver(doc, ds, slot)) return null;
    const c = cnt[doc.id];
    let sc = 0;
    const need = doc.target - c.shifts;
    sc += need * WEIGHTS.need;
    if(need <= 0){
      if(!allowOvershoot) return null;
      sc += WEIGHTS.overshoot;
    }
    sc += prefRank(doc, slot) * WEIGHTS.pref * K.pref;
    if(isW) sc += (c.wknd - avgWknd) * WEIGHTS.wkndEquity * K.equity;
    if(SLOTS[slot].overnight) sc += (c.ovn - avgOvn) * WEIGHTS.ovnEquity * K.equity;
    for(const v of softCheck(doc.id, ds, slot)){
      sc += v.code==="restrict"    ? WEIGHTS.restrict
          : v.code==="consecnight" ? WEIGHTS.consecNight
          : v.code==="consecday"   ? WEIGHTS.consecDay
          : WEIGHTS.otherSoft;
    }
    if(at(addDays(ds,-1), slot) === doc.id) sc += WEIGHTS.continuity;
    const run = consecutiveDaysIfPlaced(doc.id, ds);
    if(run > 3) sc += (run-3) * WEIGHTS.longRun;
    const same = c.byType[slot] || 0;
    const allow = sameTypeAllowance(doc, slot);
    if(same > allow) sc += (same-allow) * WEIGHTS.sameType;
    sc += quotaGain(doc, ds, slot) * WEIGHTS.quota;
    sc -= quotaOver(doc, ds, slot) * WEIGHTS.quota;
    sc += clusterScore(doc, ds);
    return sc;
  }

  const place = (ds,slot,id,isW)=>{
    assign(ds,slot,id);
    const c=cnt[id], w=dowOf(ds);
    c.shifts++; if(isW) c.wknd++; if(SLOTS[slot].overnight) c.ovn++;
    for(const r of QR) if(quotaMatches(r,ds,slot)) c.q[r.id]=(c.q[r.id]||0)+1;
    c.byType[slot]=(c.byType[slot]||0)+1;
  };
  const unplace = (ds,slot,id,isW)=>{
    assign(ds,slot,null);
    const c=cnt[id], w=dowOf(ds);
    c.shifts--; if(isW) c.wknd--; if(SLOTS[slot].overnight) c.ovn--;
    for(const r of QR) if(quotaMatches(r,ds,slot)) c.q[r.id]=(c.q[r.id]||1)-1;
    c.byType[slot]=(c.byType[slot]||1)-1;
  };
  // how many outstanding monthly minimums this placement would chip away at
  // how many outstanding minimums this placement would chip away at
  const quotaGain = (doc, ds, slot)=>{
    const c=cnt[doc.id]; let g=0;
    for(const r of QR){
      if(r.kind!=="min" || !whoMatches(r,doc) || !quotaMatches(r,ds,slot)) continue;
      if((c.q[r.id]||0) < r.count) g++;
    }
    return g;
  };
  // and how far past a maximum it would push them
  const quotaOver = (doc, ds, slot)=>{
    const c=cnt[doc.id]; let o=0;
    for(const r of QR){
      if(r.kind!=="max" || !whoMatches(r,doc) || !quotaMatches(r,ds,slot)) continue;
      if((c.q[r.id]||0) >= r.count) o++;
    }
    return o;
  };
  // shifts this doctor still owes across every minimum
  const quotaShort = doc => QR.reduce((n,r)=>
    n + (r.kind==="min" && whoMatches(r,doc)
         ? Math.max(0, r.count - (cnt[doc.id].q[r.id]||0)) : 0), 0);
  // would taking this shift off the holder drop them under a minimum?
  const quotaNeeded = (doc, ds, slot)=>{
    const c=cnt[doc.id];
    for(const r of QR){
      if(r.kind!=="min" || !whoMatches(r,doc) || !quotaMatches(r,ds,slot)) continue;
      if((c.q[r.id]||0) <= r.count) return true;
    }
    return false;
  };

  // Pass one: hand out the shifts that satisfy an outstanding monthly minimum,
  // neediest doctor first. Greedy fill alone tends to strand the last doctor.
  for(let round=0; round<8; round++){
    const short = roster
      .map(d=>({d, need:quotaShort(d)}))
      .filter(x=>x.need>0)
      .sort((a,b)=> b.need-a.need);
    if(!short.length) break;
    let progress = 0;
    for(const {d} of short){
      let pick=null, pickScore=-Infinity;
      for(const t of todo){
        if(at(t.ds,t.slot)) continue;
        if(!quotaGain(d, t.ds, t.slot)) continue;
        const sc = score(d, t.ds, t.slot, t.isW, true);
        if(sc!==null && sc>pickScore){ pickScore=sc; pick=t; }
      }
      if(pick){ place(pick.ds, pick.slot, d.id, pick.isW); progress++; }
    }
    if(!progress) break;
  }

  const unfilled = [];
  for(const t of todo){
    if(at(t.ds,t.slot)) continue;
    let best=null, bestScore=-Infinity;
    for(const strict of [true,false]){          // relax maximums only if we must
      for(const doc of roster){
        const sc = score(doc, t.ds, t.slot, t.isW, strict);
        if(sc===null) continue;
        if(sc > bestScore){ bestScore=sc; best=doc; }
      }
      if(best) break;
    }
    if(best) place(t.ds, t.slot, best.id, t.isW);
    else unfilled.push({ds:t.ds, slot:t.slot});
  }

  // Balancing pass — hand shifts from doctors past their target to doctors
  // short of it, wherever that is legal and does not worsen preference much.
  for(let pass=0; pass<3; pass++){
    let moved = 0;
    const short = roster.filter(d=> cnt[d.id].shifts < d.target)
                        .sort((a,b)=> (cnt[a.id].shifts-a.target) - (cnt[b.id].shifts-b.target));
    for(const doc of short){
      if(cnt[doc.id].shifts >= doc.target) continue;
      let take=null, takeScore=-Infinity;
      for(const ds of days){
        const isW = S.rules.weekendDays.includes(dowOf(ds));
        for(const slot of slotsFor(ds)){
          const holder = at(ds,slot);
          if(!holder || holder===doc.id) continue;
          const h = docById(holder);
          if(!h || !cnt[holder] || cnt[holder].shifts <= h.target) continue;
          if(quotaGain(h, ds, slot)) continue;              // holder still needs it
          if(quotaNeeded(h, ds, slot)) continue;            // taking it drops them under
          unplace(ds,slot,holder,isW);
          const sc = score(doc, ds, slot, isW, true);
          if(sc!==null && sc>takeScore){ takeScore=sc; take={ds,slot,holder,isW}; }
          place(ds,slot,holder,isW);
        }
      }
      if(take){
        unplace(take.ds,take.slot,take.holder,take.isW);
        place(take.ds,take.slot,doc.id,take.isW);
        moved++;
      }
    }
    if(!moved) break;
  }

  // Quota repair — hand a weekend or ins shift from someone with a surplus to
  // someone still short, wherever that is legal.
  for(let pass=0; pass<3; pass++){
    let moved = 0;
    for(const doc of roster){
      const wants = QR.filter(r=> r.kind==="min" && whoMatches(r,doc)
                                  && (cnt[doc.id].q[r.id]||0) < r.count);
      for(const want of wants){
        let take=null, takeScore=-Infinity;
        for(const ds of days){
          const isW = S.rules.weekendDays.includes(dowOf(ds));
          for(const slot of slotsFor(ds)){
            if(!quotaMatches(want, ds, slot)) continue;
            const holder = at(ds,slot);
            if(!holder || holder===doc.id || !cnt[holder]) continue;
            const h = docById(holder); if(!h) continue;
            if(quotaNeeded(h, ds, slot)) continue;   // holder would drop below a minimum
            unplace(ds,slot,holder,isW);
            const sc = score(doc, ds, slot, isW, true);
            if(sc!==null && sc>takeScore){ takeScore=sc; take={ds,slot,holder,isW}; }
            place(ds,slot,holder,isW);
          }
        }
        if(take){
          unplace(take.ds,take.slot,take.holder,take.isW);
          place(take.ds,take.slot,doc.id,take.isW);
          moved++;
        }
      }
    }
    if(!moved) break;
  }

  // Last look at anything still open, now that the board has shifted around.
  const stillOpen = [];
  for(const u of unfilled){
    if(at(u.ds,u.slot)) continue;
    const isW = S.rules.weekendDays.includes(dowOf(u.ds));
    let best=null, bestScore=-Infinity;
    for(const strict of [true,false]){
      for(const doc of roster){
        const sc = score(doc, u.ds, u.slot, isW, strict);
        if(sc!==null && sc>bestScore){ bestScore=sc; best=doc; }
      }
      if(best) break;
    }
    if(best) place(u.ds,u.slot,best.id,isW);
    else stillOpen.push(u);
  }

  const after = Object.values(cnt).reduce((a,b)=>a+b.shifts,0);
  save();
  return {
    placed: after-before, cleared, before, totalSlots,
    filled: after, open: totalSlots-after, unfilled: stillOpen,
    onTarget: roster.filter(d=>cnt[d.id].shifts===d.target).length,
    rosterN: roster.length,
    unmet: quotaCheck(y,m),
    capacity: quotaCapacity(y,m),
  };
}

   4. AGGREGATES
   ============================================================ */

let _statCache=null, _statKey="";
function stats(){
  const key = S.view.y+"-"+S.view.m+"|"+JSON.stringify(S.schedule).length
            +"|"+JSON.stringify(S.spike||{}).length+"|"+_dirty;
  if(_statCache && _statKey===key) return _statCache;
  const days = monthDays(S.view.y,S.view.m);
  const out={};
  activeRoster().forEach(d=>out[d.id]={shifts:0,wknd:0,ovn:0,pto:0,target:d.target});
  for(const ds of days){
    const day = S.schedule[ds]||{};
    const isWknd = S.rules.weekendDays.includes(dowOf(ds));
    for(const k in day){
      const id=day[k]; if(!out[id]) continue;
      out[id].shifts++;
      if(isWknd) out[id].wknd++;
      if(SLOTS[k] && SLOTS[k].overnight) out[id].ovn++;
    }
    for(const e of spikeOn(ds)){          // worked, so it shows in their load
      if(!e.doc || !out[e.doc]) continue;
      out[e.doc].shifts++;
      if(isWknd) out[e.doc].wknd++;
    }
    for(const id in out) if(isPTO(id,ds)) out[id].pto++;
  }
  _statCache=out; _statKey=key;
  return out;
}
let _dirty=0;
const touch = ()=>{ _dirty++; };

/* Monthly minimums. These are not placement rules — you cannot break one by
   putting a doctor somewhere. They are quotas the finished month either meets
   or does not, so they are measured over the whole month. */
// Count, for every doctor, how many shifts fall under each active quota rule.
function tallies(y,m){
  const days = monthDays(y,m), rules = activeQuotas(), out = {};
  activeRoster().forEach(d=>{ out[d.id]={}; rules.forEach(r=> out[d.id][r.id]=0); });
  for(const ds of days){
    for(const slot of slotsFor(ds)){
      const id = at(ds,slot);
      if(!id || !out[id]) continue;
      for(const r of rules) if(quotaMatches(r, ds, slot)) out[id][r.id]++;
    }
  }
  // a weekday rule counts days worked, not shifts — a doctor cannot work a
  // Saturday twice, but the loop above would count each matching slot once anyway
  return out;
}
function quotaCheck(y,m){
  const t = tallies(y,m), out = [];
  for(const r of activeQuotas()){
    for(const d of activeRoster()){
      if(!whoMatches(r,d)) continue;
      const have = (t[d.id]||{})[r.id] || 0;
      if(r.kind==="min" && r.count>0 && have < r.count)
        out.push({id:d.id, rule:r.id, code:"min", short:r.count-have,
          msg:`${d.id} has ${have} of ${r.count} required ${quotaUnit(r)}`});
      if(r.kind==="max" && have > r.count)
        out.push({id:d.id, rule:r.id, code:"max", short:have-r.count,
          msg:`${d.id} has ${have} ${quotaUnit(r)}, over the limit of ${r.count}`});
    }
  }
  return out;
}
function quotaUnit(r){
  const w = r.what||{};
  return w.type==="weekday" ? `${DOW[w.weekday]}s`
       : w.type==="slot"    ? SLOTS[w.slot].label
       : "shifts";
}
// Whether a minimum is even reachable this month, as pure arithmetic.
function quotaCapacity(y,m){
  const days = monthDays(y,m);
  const rows = [];
  for(const r of activeQuotas()){
    if(r.kind!=="min" || !r.count) continue;
    const people = activeRoster().filter(d=>whoMatches(r,d));
    let slots = 0;
    for(const ds of days) for(const slot of slotsFor(ds)) if(quotaMatches(r,ds,slot)) slots++;
    const need = people.length * r.count;
    rows.push({rule:r, slots, need, n:people.length,
      fits: slots>=need, maxDocs: Math.floor(slots/r.count)});
  }
  return rows;
}
// Whether the month can even satisfy the weekend minimums, as pure arithmetic.
function monthAudit(){
  const days = monthDays(S.view.y,S.view.m);
  let total=0, filled=0, open=0;
  const issues=[]; const cellFlags={};
  for(const ds of days){
    for(const slot of slotsFor(ds)){
      total++;
      const id = at(ds,slot);
      if(!id){ open++; continue; }
      filled++;
      const v = checkPlacement(id, ds, slot);
      if(v.length){
        const worst = v.some(x=>x.level==="hard") ? "hard":"soft";
        cellFlags[ds+"|"+slot] = {level:worst, list:v};
        v.forEach(x=>issues.push({...x, date:ds, slot, id}));
      }
    }
  }
  issues.sort((a,b)=> (a.level===b.level? a.date.localeCompare(b.date) : (a.level==="hard"?-1:1)));
  const quotas = quotaCheck(S.view.y, S.view.m);
  return {total, filled, open, issues, cellFlags, quotas,
          hard:issues.filter(i=>i.level==="hard").length,
          soft:issues.filter(i=>i.level==="soft").length,
          unmet:quotas.length};
}

function renderKpis(a){
  const st = stats();
  const targetSum = activeRoster().reduce((s,d)=>s+ (+d.target||0), 0);
  const pct = a.total? Math.round(a.filled/a.total*100):0;
  const cap = targetSum - a.total;

  const host = $("#kpis"); host.innerHTML="";
  host.appendChild(tile({
    lab:"Slots filled", val:a.filled, of:` / ${a.total}`,
    note:`${pct}% of the month covered`,
    meter:{pct, cls: a.filled>=a.total?"done":""}
  }));
  host.appendChild(tile({
    lab:"OPEN shifts", val:a.open, cls: a.open? "warnt":"clear",
    note: a.open ? "unfilled — needs coverage" : "fully covered"
  }));
  host.appendChild(tile({
    lab:"Rule violations", val:a.hard, cls: a.hard? "alert":"clear",
    note: a.hard ? "hard rules broken" : "no hard rules broken"
  }));
  host.appendChild(tile({
    lab:"Capacity vs demand", val:(cap>=0?"+":"")+cap,
    cls: cap<0 ? "alert":"clear",
    note: cap>=0
      ? `${targetSum} preferred shifts for ${a.total} slots`
      : `short ${Math.abs(cap)} shifts of preferred capacity`
  }));
}
function tile({lab,val,of,note,cls,meter}){
  const t = el("div","tile"+(cls?" "+cls:""));
  t.appendChild(el("div","lab",lab));
  const v = el("div","val"); v.textContent = val;
  if(of){ const o=el("span","of",of); v.appendChild(o); }
  t.appendChild(v);
  if(note) t.appendChild(el("div","note",note));
  if(meter){
    const m = el("div","meter"+(meter.cls?" "+meter.cls:""));
    const i = el("i"); i.style.width = Math.min(100,meter.pct)+"%";
    m.appendChild(i); t.appendChild(m);
  }
  return t;

function renderCal(audit){

    const inMonth = d.getMonth()===S.view.m;
    const w = d.getDay();
    const cell = el("div","day"+(inMonth?"":" out")+([0,6].includes(w)?" we":"")+(ds===todayIso?" today":""));

    const hd = el("div","day-h");
    if(inMonth){
      const nBtn = el("button","day-n"+(dayIsCustom(ds)?" custom":""), String(d.getDate()));
      nBtn.title = dayIsCustom(ds)
        ? "This day has its own set of shifts — click to change"
        : "Add or remove shifts for this day";
      nBtn.addEventListener("click", ()=> openDaySetup(ds));
      hd.appendChild(nBtn);
    } else {
      hd.appendChild(el("span","day-n", String(d.getDate())));
    }
    hd.appendChild(el("span","day-dow", DOW3[w]));
    const slots = slotsFor(ds);
    if(inMonth){
      const filled = slots.filter(s=>at(ds,s)).length;
      hd.appendChild(el("span","day-cnt"+(filled<slots.length?" short":""), `${filled}/${slots.length}`));
    }
    cell.appendChild(hd);

    if(inMonth){
      // OFF strip — each name is a toggle, and "+" opens the whole day
      const o = el("div","off-line");
      const offList = activeRoster().filter(x=>isPTO(x.id,ds));
      if(offList.length) o.appendChild(el("b","","OFF"));
      for(const doc of offList){
        const clash = shiftsOn(ds, doc.id).length>0;
        const c = el("button","offchip"+(clash?" clash":""), doc.initials);
        c.title = clash
          ? `${doc.initials} requested this day off but is still on ${SLOTS[shiftsOn(ds,doc.id)[0]].label} — click to cancel the request`
          : `${doc.initials} requested ${fmtShort(ds)} off — click to make them available again`;
        c.addEventListener("click", ()=>{ setReq(doc.id, ds, false); save(); render(); });
        o.appendChild(c);
      }
      // phone-only: Spike 3 rides in the day cell since the lane is hidden there
      const sl = spikeOn(ds);
      if(sl.length){
        const si = el("button","spkinline");
        for(const e of sl){
          const t = spikeTime(e.t);
          const chip = el("span","spkchip"+(e.doc?"":" open"));
          chip.appendChild(el("span","tm", t?t.label:"?"));
          chip.appendChild(document.createTextNode(e.doc || "OPEN"));
          si.appendChild(chip);
        }
        si.addEventListener("click", ()=> openSpikeDay(ds));
        cell.appendChild(si);
      }
      const plus = el("button","offadd", offList.length ? "+" : "+ mark off");
      plus.title = `Set who is off on ${fmtShort(ds)}`;
      plus.addEventListener("click", ()=> openOffDay(ds));
      o.appendChild(plus);
      cell.appendChild(o);
      for(const slot of slots){
        cell.appendChild(slotRow(ds, slot, audit));
      }
    }
    cal.appendChild(cell);
    week.push(ds);
    if(week.length===7){ appendSpikeLane(cal, week.slice()); week.length=0; }
  }
}

// One compact band per week. On narrow screens the grid is a single column, so
// the lane is hidden there and each day carries its own inline Spike 3 line.
function appendSpikeLane(cal, week){
  const any = week.some(ds=>spikeOn(ds).length);
  for(const ds of week){
    const d = fromIso(ds);
    const inMonth = d.getMonth()===S.view.m;
    const c = el("button","spklane"+(inMonth?"":" out")+(any?"":" bare"));
    if(!inMonth){ c.disabled = true; cal.appendChild(c); continue; }
    c.title = "Spike 3 for "+fmtShort(ds);
    const list = spikeOn(ds);
    if(!list.length){
      c.appendChild(el("span","spkdash","·"));
    } else {
      for(const e of list){
        const t = spikeTime(e.t);
        const chip = el("span","spkchip"+(e.doc?"":" open"));
        chip.appendChild(el("span","tm", t?t.label:"?"));
        chip.appendChild(document.createTextNode(e.doc || "OPEN"));
        c.appendChild(chip);
      }
    }
    c.addEventListener("click", ()=> openSpikeDay(ds));
    cal.appendChild(c);
  }
}

function slotRow(ds, slot, audit){
  const row = el("div","slot"+(SLOTS[slot].overnight?" noc":""));
  row.appendChild(el("span","t", SLOTS[slot].label));
  const id = at(ds,slot);
  const flag = audit.cellFlags[ds+"|"+slot];
  const b = el("button","chip"+(id?"":" open")+(flag?" "+flag.level:""));
  if(id){
    const doc = docById(id);
    if(doc) tintEl(b, doc.color); else b.style.background="var(--surface-2)";
    b.appendChild(el("span","nm", doc ? doc.initials : id));
    if(flag){
      const f = el("span","flag "+(flag.level==="hard"?"h":"s"), flag.level==="hard"?"●":"▲");
      f.title = flag.list.map(x=>x.msg).join("\n");
      b.appendChild(f);
    }
  } else {
    b.appendChild(el("span","nm","OPEN"));
    // while placing a doctor, grey out the slots they cannot legally take
    if(armed){
      const hard = checkPlacement(armed, ds, slot).filter(x=>x.level==="hard");
      if(hard.length && !S.rules.allowOverride){
        b.classList.add("noarm");
        b.title = hard[0].msg;
      }
    }
  }
  b.addEventListener("click", ()=>{
    if(armed && !id){ placeArmed(ds,slot); return; }
    openPicker(ds,slot);
  });
  // the doctor keeps the full width; any NERDs sit on a line beneath
  const col = el("div","cellcol");
  col.appendChild(b);
  if(id){
    const line = el("div","nerdline");
    for(const nid of nerdsOn(ds,slot)){
      const n = nerdById(nid);
      const c = el("button","nerdchip", n ? n.initials : nid);
      c.title = (n && n.name ? n.name+" — " : "") + "NERD with "+id+", click to change";
      c.addEventListener("click", ev=>{ ev.stopPropagation(); openNerdPicker(ds,slot); });
      line.appendChild(c);
    }
    if(nerdAllowed(ds,slot).ok && activeNerds().length){
      const add = el("button","nerdadd","+ NERD");
      add.title = "Add a NERD to this shift";
      add.addEventListener("click", ev=>{ ev.stopPropagation(); openNerdPicker(ds,slot); });
      line.appendChild(add);
    }
    if(line.children.length) col.appendChild(line);
  }
  row.appendChild(col);
  return row;
}

function renderIssues(a){
  const host = $("#issues"); host.innerHTML="";
  const bits=[];
  if(a.hard) bits.push(`${a.hard} hard`);
  if(a.soft) bits.push(`${a.soft} soft`);
  if(a.unmet) bits.push(`${a.unmet} unmet`);
  $("#issueCount").textContent = bits.join(" · ");

  if(a.quotas.length){
    const capy = quotaCapacity(S.view.y,S.view.m);
    const tight = {}; capy.forEach(c=>{ if(!c.fits) tight[c.rule.id]=c; });
    host.appendChild(el("div","pgroup","Monthly minimums"));
    if(Object.keys(tight).length){
      const n = el("div","hint capnote");
      const parts = Object.values(tight).map(c=>
        `only ${c.slots} ${quotaUnit(c.rule)} exist but ${c.n} × ${c.rule.count} needs ${c.need}, so at most ${c.maxDocs} can reach it`);
      n.textContent = "This month cannot satisfy every minimum: " + parts.join("; ") +
        ". Auto-fill spreads what exists so nobody is left with none.";
      host.appendChild(n);
    }
    for(const q of a.quotas){
      const b = el("button","issue q");
      b.appendChild(el("span","bar"));
      const wr = el("div");
      const impossible = q.code==="min" && tight[q.rule];
      wr.appendChild(el("div","d", impossible ? "not reachable this month"
                                              : (q.code==="max" ? "over by "+q.short : "short by "+q.short)));
      const mm = el("div","m"); mm.innerHTML = q.msg.replace(/^(\S+)/, "<b>$1</b>");
      wr.appendChild(mm);
      b.appendChild(wr);
      b.addEventListener("click", openRoster);
      host.appendChild(b);
    }
  }

  if(!a.issues.length){
    if(!a.quotas.length){
      const e = el("div","empty"+(a.open?"":" ok"),
        a.open ? "No violations. "+a.open+" slot"+(a.open>1?"s":"")+" still OPEN."
               : "Every slot covered, no rules broken. All cats herded.");
      host.appendChild(e);
    }
    return;
  }
  if(a.quotas.length) host.appendChild(el("div","pgroup","Placements"));
  for(const i of a.issues.slice(0,140)){
    const b = el("button","issue "+(i.level==="hard"?"h":"s"));
    b.appendChild(el("span","bar"));
    const wrap = el("div");
    wrap.appendChild(el("div","d", `${fmtShort(i.date)} · ${SLOTS[i.slot].label}`));
    const m = el("div","m"); m.innerHTML = i.msg.replace(/^(\w+)/, "<b>$1</b>");
    wrap.appendChild(m);
    b.appendChild(wrap);
    b.addEventListener("click", ()=> openPicker(i.date, i.slot));
    host.appendChild(b);
  }
}

function toggleArm(id){
  armed = (armed===id) ? null : id;
  document.body.classList.toggle("armed", !!armed);
  if(armed) $("#armName").textContent = armed;
  render();
}
function placeArmed(ds,slot){
  const v = checkPlacement(armed, ds, slot);
  const hard = v.filter(x=>x.level==="hard");
  if(hard.length && !S.rules.allowOverride){
    flashBlock(hard[0].msg); return;
  }
  assign(ds,slot,armed);
  render();
}
let flashT=null;
function flashBlock(msg){
  let n = $("#flash");
  if(!n){
    n = el("div"); n.id="flash";
    n.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:120;"+
      "background:var(--crit);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;"+
      "box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center";
    document.body.appendChild(n);
  }
  n.textContent = msg; n.style.display="block";
  clearTimeout(flashT); flashT=setTimeout(()=>{n.style.display="none";},2400);
}

function showModal(node){

}
function closeModal(){ $("#veil").classList.remove("on"); $("#modalHost").innerHTML=""; }
$("#veil").addEventListener("click", e=>{ if(e.target.id==="veil") closeModal(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#veil").classList.contains("on")) closeModal(); else if(armed) toggleArm(armed); }
});
function modalShell(title, sub, wide){
  const m = el("div","modal"+(wide?" wide":""));
  const h = el("div","modal-h");

  box.appendChild(el("h3","",title));
