/* ---- assignment picker ---- */
function openPicker(ds, slot){
  const cur = at(ds,slot);
  const {m, body, foot} = modalShell(
    SLOTS[slot].label,
    `${DOW[dowOf(ds)]}, ${fromIso(ds).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}`
  );
  const st = stats();

  const rows = activeRoster().map(d=>{
    const v = checkPlacement(d.id, ds, slot);
    const hard = v.filter(x=>x.level==="hard");
    const soft = v.filter(x=>x.level==="soft");
    const s = st[d.id]||{shifts:0};
    return {d, v, hard, soft, need: d.target - s.shifts, cur:s.shifts};
  });
  rows.sort((a,b)=>{
    const rank = r => r.hard.length ? 2 : (r.soft.length ? 1 : 0);
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    if(b.need!==a.need) return b.need-a.need;
    const pa = prefRank(a.d, slot), pb = prefRank(b.d, slot);
    if(pb!==pa) return pb-pa;
    return a.d.initials.localeCompare(b.d.initials);
  });

  const groups = [
    ["Currently assigned", r=>r.d.id===cur],
    ["Available", r=>r.d.id!==cur && !r.hard.length && !r.soft.length],
    ["Available with a caution", r=>r.d.id!==cur && !r.hard.length && r.soft.length],
    ["Blocked", r=>r.d.id!==cur && r.hard.length],
  ];
  for(const [gname, test] of groups){
    const set = rows.filter(test);
    if(!set.length) continue;
    body.appendChild(el("div","pgroup", gname));
    for(const r of set){
      const isCur = r.d.id===cur;
      const blocked = !isCur && r.hard.length && !S.rules.allowOverride;
      const btn = el("button","pick"+(blocked?" blocked":""));
      if(isCur) btn.style.cssText="background:var(--brand-soft);border-color:var(--brand-mid)";
      const who = el("div","who");
      const ini = el("span","ini", r.d.initials); tintEl(ini, r.d.color);
      who.appendChild(ini);
      if(r.d.name) who.appendChild(el("span","full", r.d.name));
      btn.appendChild(who);
      const right = el("div","right");
      const pi = (r.d.prefs||[]).indexOf(slot);
      if(pi>=0 && pi<3 && !r.hard.length)
        right.appendChild(el("span","pref", pi===0 ? "top choice" : `#${pi+1} choice`));
      right.appendChild(el("span","load", `${r.cur}/${r.d.target}`));
      if(r.hard.length) right.appendChild(el("span","why h", r.hard[0].msg));
      else if(r.soft.length) right.appendChild(el("span","why s", r.soft[0].msg));
      else if(isCur) right.appendChild(el("span","why g", "on this shift"));
      else if(r.need>0) right.appendChild(el("span","why g", `needs ${r.need} more`));
      btn.appendChild(right);
      if(isCur){
        btn.addEventListener("click", ()=>{ assign(ds,slot,null); closeModal(); render(); });
      } else if(!blocked){
        btn.addEventListener("click", ()=>{ assign(ds,slot,r.d.id); closeModal(); render(); });
      }
      body.appendChild(btn);
    }
  }

  if(cur && activeNerds().length){
    const g = nerdAllowed(ds,slot);
    const on = nerdsOn(ds,slot);
    const nb = el("button","btn");
    nb.style.cssText = "border-color:var(--nerd-mid);color:var(--nerd)";
    nb.textContent = !g.ok ? "NERDs not allowed here"
                   : on.length ? `NERDs · ${on.map(x=>(nerdById(x)||{}).initials||x).join(", ")}`
                   : "+ Add a NERD";
    if(g.ok) nb.addEventListener("click", ()=>{ closeModal(); openNerdPicker(ds,slot); });
    else { nb.disabled = true; nb.title = g.why; nb.style.opacity=".55"; }
    foot.appendChild(nb);
  }
  if(cur){
    const clr = el("button","btn danger","Clear this slot");
    clr.addEventListener("click", ()=>{ assign(ds,slot,null); closeModal(); render(); });
    foot.appendChild(clr);
  }
  foot.appendChild(el("span","spacer"));
  const hintTxt = S.rules.allowOverride
      ? "Override is on — blocked doctors can still be placed."
      : "Blocked doctors break a hard rule. Turn on override in Rules to place anyway.";
  foot.appendChild(el("span","hint", hintTxt));
  showModal(m);
}

/* ---- roster ---- */
function openRoster(){
  const {m, body, foot} = modalShell("Doctors", "Targets, overnight eligibility, restrictions and requested days off", true);
  const list = el("div");
  let draw = ()=>{
    list.innerHTML="";
    S.roster.forEach((d,idx)=>{
      const card = el("div","rowcard"+(d.active?"":" off"));
      const cols = el("div","doccols");
      const leftCol = el("div");
      const g = el("div","grid5");

      const c1=el("div"); c1.appendChild(labeled("Initials", inputFor(d,"initials","text")));
      const c2=el("div"); c2.appendChild(labeled("Name", inputFor(d,"name","text")));
      const c3=el("div"); c3.appendChild(labeled("Target", inputFor(d,"target","number")));
      const c4=el("div");
      const chks=el("div"); chks.style.cssText="display:flex;flex-direction:column;gap:3px";
      chks.appendChild(chk("Overnights", d.nightOK, v=>{ d.nightOK=v; save(); render(); }));
      chks.appendChild(chk("Active", d.active, v=>{ d.active=v; save(); draw(); render(); }));
      c4.appendChild(chks);
      const c5=el("div");
      const rm=el("button","btn danger","×"); rm.title="Remove";
      rm.addEventListener("click", ()=>{
        if(confirm(`Remove ${d.initials}? Existing assignments stay but will show as unknown.`)){
          S.roster.splice(idx,1); save(); draw(); render();
        }
      });
      c5.appendChild(rm);
      g.append(c1,c2,c3,c4,c5);
      leftCol.appendChild(g);

      const rl = el("div");
      const dc = el("div","daychks");
      DOW3.forEach((nm,w)=>{
        const state = restrictState(d,w); // 0 none, 1 all, 2 late
        const b = el("button","daychk"+(state?" on":""), nm + (state===2?" late":""));
        b.addEventListener("click", ()=>{ cycleRestrict(d,w); save(); draw(); render(); });
        dc.appendChild(b);
      });
      rl.appendChild(dc);
      const nt = el("input"); nt.type="text"; nt.value=d.notes||""; nt.placeholder="Notes";
      nt.style.marginTop="7px";
      nt.addEventListener("input", ()=>{ d.notes=nt.value; save(); });
      rl.appendChild(nt);
      rl.appendChild(prefBox(d, ()=>draw()));
      leftCol.appendChild(rl);

      cols.appendChild(leftCol);
      cols.appendChild(miniCal(d, ()=>draw()));
      card.appendChild(cols);
      list.appendChild(card);
    });
  };
  const labeled=(t,node)=>{const w=el("div");w.appendChild(el("label","fl",t));w.appendChild(node);return w;};
  function inputFor(d,key,type){
    const i=el("input"); i.type=type; i.value=d[key]==null?"":d[key];
    i.addEventListener("input", ()=>{
      d[key] = type==="number" ? (parseInt(i.value,10)||0) : i.value;
      if(key==="initials") d.id = i.value;
      save(); render();
    });
    return i;
  }
  function chk(label, val, on){
    const w=el("label","chk"); const i=el("input"); i.type="checkbox"; i.checked=!!val;
    i.addEventListener("change", ()=>on(i.checked));
    w.appendChild(i); w.appendChild(document.createTextNode(label)); return w;
  }
  // month nav — the request calendars follow whichever month you are building
  const bar = el("div","reqbar");
  const nav = el("div","mn");
  const bPrev = el("button","","‹"), lb = el("div","lb"), bNext = el("button","","›");
  nav.append(bPrev, lb, bNext);
  bar.appendChild(nav);
  const barNote = el("span","hint");
  bar.appendChild(barNote);

  const stamp = ()=>{
    lb.textContent = new Date(S.view.y,S.view.m,1)
        .toLocaleDateString(undefined,{month:"long",year:"numeric"});
    const days = monthDays(S.view.y,S.view.m);
    let total=0, clash=0;
    for(const d of activeRoster()){
      const off=(S.pto[d.id]||[]).filter(x=>days.includes(x));
      total+=off.length;
      clash+=off.filter(x=>shiftsOn(x,d.id).length).length;
    }
    barNote.textContent = (total ? `${total} day${total>1?"s":""} requested off` : "No requests off yet")
      + (clash ? ` · ${clash} still has a shift placed` : "");
  };
  const step = n => ()=>{ let{y,m}=S.view; m+=n; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.view={y,m}; render(); draw(); };
  bPrev.addEventListener("click", step(-1));
  bNext.addEventListener("click", step(1));

  const _draw = draw;
  draw = ()=>{ _draw(); stamp(); };
  draw();

  const lede = el("div","hint");
  lede.style.marginBottom="10px";
  lede.textContent = "Target is preferred shifts per month. Blocked weekdays warn but never block — click once for the whole day, twice for late shifts only. Requested days off are a hard block: click a date to toggle it, shift-click to run a range.";
  body.appendChild(lede);
  body.appendChild(bar);
  body.appendChild(list);

  // ---- NERDs ----
  body.appendChild(el("div","pgroup","NERDs"));
  const nlede = el("div","hint"); nlede.style.marginBottom="8px";
  nlede.textContent = "New Emergency Room Doctors shadow a doctor on a shift. No targets, no preferences, no requests off — never on Wednesdays, and on Tuesdays only 6a–6p or 8a–8p.";
  body.appendChild(nlede);
  const nhost = el("div"); body.appendChild(nhost);

  function drawNerds(){
    nhost.innerHTML="";
    const counts = nerdCounts(S.view.y,S.view.m);
    if(!(S.nerds||[]).length) nhost.appendChild(el("div","empty","No NERDs yet."));
    (S.nerds||[]).forEach((n,i)=>{
      const row = el("div","nerdrow"+(n.active===false?" off":""));
      const dot = el("span","ndot"); row.appendChild(dot);
      const ini = el("input"); ini.type="text"; ini.value=n.initials||""; ini.placeholder="JA";
      ini.style.cssText="width:64px;flex:none";
      ini.addEventListener("input", ()=>{ n.initials=ini.value; n.id=ini.value; save(); render(); });
      row.appendChild(ini);
      const nm = el("input"); nm.type="text"; nm.value=n.name||""; nm.placeholder="Name";
      nm.addEventListener("input", ()=>{ n.name=nm.value; save(); });
      row.appendChild(nm);
      row.appendChild(el("span","ncnt", `${counts[n.id]||0} shifts`));
      const rm = el("button","btn danger","×"); rm.title="Remove";
      rm.addEventListener("click", ()=>{
        const total = counts[n.id]||0;
        if(!confirm(`Remove ${n.initials||"this NERD"}?` + (total?` They are on ${total} shift${total>1?"s":""} this month, which will be cleared.`:""))) return;
        for(const ds in (S.nerdAssign||{}))
          for(const slot in S.nerdAssign[ds]) setNerd(ds,slot,n.id,false);
        S.nerds.splice(i,1); save(); drawNerds(); render();
      });

/* Ranked shift preferences — soft weighting the solver reads, never a rule.
   Collapsed to a one-line summary until you open it, so the roster stays scannable. */
const prefOpen = {};
function prefBox(d, redraw){
  const wrap = el("div","prefbox");
  if(!Array.isArray(d.prefs) || !d.prefs.length) d.prefs = SLOT_ORDER.slice();
  // keep the list honest if slot types ever change
  d.prefs = d.prefs.filter(k=>SLOTS[k]).concat(SLOT_ORDER.filter(k=>!d.prefs.includes(k)));

  // how many shifts in a row this doctor likes
  const bp = el("div","blockrow");
  bp.appendChild(el("span","lbl","Shifts in a row"));
  [[1,"1"],[2,"2"],[3,"3"],[4,"4"],[0,"any"]].forEach(([v,t])=>{
    const b = el("button","bp"+((d.blockPref|0)===v?" on":""), t);
    b.title = v ? `${d.initials} prefers working ${v} day${v>1?"s":""} in a row`
                : `${d.initials} has no preference either way`;
    b.addEventListener("click", ()=>{ d.blockPref = v; save(); redraw(); render(); });
    bp.appendChild(b);
  });
  wrap.appendChild(bp);

  const sum = el("button","prefsum");
  sum.appendChild(document.createTextNode("Prefers "));
  const b = el("b","", d.prefs.slice(0,3).map(k=>SLOTS[k].label).join(", "));
  sum.appendChild(b);
  sum.appendChild(el("span","ed", prefOpen[d.id] ? "close" : "reorder"));
  sum.addEventListener("click", ()=>{ prefOpen[d.id] = !prefOpen[d.id]; redraw(); });
  wrap.appendChild(sum);

  if(prefOpen[d.id]){
    const list = el("div","preflist");
    d.prefs.forEach((k,i)=>{
      const row = el("div","prefrow"+(i<3?" top":""));
      row.appendChild(el("span","r", String(i+1)));
      row.appendChild(el("span","l", SLOTS[k].label));
      if(SLOTS[k].overnight && !d.nightOK)
        row.appendChild(el("span","hint","day-only"));
      const up = el("button","mv","▲"), dn = el("button","mv","▼");
      if(i===0) up.setAttribute("disabled","");
      if(i===d.prefs.length-1) dn.setAttribute("disabled","");
      up.addEventListener("click", ()=>{ swapPref(d,i,i-1); save(); redraw(); });
      dn.addEventListener("click", ()=>{ swapPref(d,i,i+1); save(); redraw(); });
      row.append(up,dn);
      list.appendChild(row);
    });
    wrap.appendChild(list);
    const rs = el("button","btn"); rs.textContent="Reset to their usual mix";
    rs.style.cssText="margin-top:6px;font-size:11.5px;padding:3px 8px";
    rs.title="Back to the ranking derived from what they actually worked";
    rs.addEventListener("click", ()=>{
      d.prefs = (SEED_PREFS[d.initials]||SLOT_ORDER).slice(); save(); redraw();
    });
    wrap.appendChild(rs);
  }
  return wrap;
}
function swapPref(d,i,j){
  if(j<0 || j>=d.prefs.length) return;
  const t=d.prefs[i]; d.prefs[i]=d.prefs[j]; d.prefs[j]=t;
}

function restrictState(d,w){
  const r = (d.restrictions||[]).find(x=>x.days.includes(w));
  if(!r) return 0;
  return r.slots==="late" ? 2 : 1;
}
function cycleRestrict(d,w){
  d.restrictions = d.restrictions||[];
  const st = restrictState(d,w);
  d.restrictions = d.restrictions.filter(x=>!x.days.includes(w) || (x.days=x.days.filter(y=>y!==w)).length);
  if(st===0) d.restrictions.push({days:[w], slots:"all"});
  else if(st===1) d.restrictions.push({days:[w], slots:"late"});
}

/* ---- requests off: a mini calendar that belongs to one doctor ---- */
let lastReqClick = {};   // doctorId -> last date clicked, for shift-click ranges

function setReq(id, ds, on){
  S.pto[id] = S.pto[id] || [];
  const i = S.pto[id].indexOf(ds);
  if(on && i<0) S.pto[id].push(ds);
  if(!on && i>=0) S.pto[id].splice(i,1);
  S.pto[id].sort();
}

// One doctor's month. Click a day to block it; shift-click to run a range.
function miniCal(d, redraw){
  const days = monthDays(S.view.y, S.view.m);
  const off = new Set((S.pto[d.id]||[]).filter(x=>days.includes(x)));

  const wrap = el("div","reqblock");
  const h = el("h5");
  h.appendChild(document.createTextNode("Requested off"));
  const n = el("span","n"+(off.size?" has":""), off.size ? `${off.size} day${off.size>1?"s":""}` : "none");
  h.appendChild(n);
  if(off.size){
    const clr = el("button","clr","×");
    clr.title = `Clear ${d.initials}'s requests for this month`;
    clr.addEventListener("click", ()=>{
      S.pto[d.id] = (S.pto[d.id]||[]).filter(x=>!days.includes(x));
      save(); redraw(); render();
    });
    h.appendChild(clr);
  }
  wrap.appendChild(h);

  const mini = el("div","mini");
  ["S","M","T","W","T","F","S"].forEach(x=> mini.appendChild(el("div","mh", x)));
  for(let i=0;i<fromIso(days[0]).getDay();i++){
    const b=el("button","blank"); b.tabIndex=-1; mini.appendChild(b);
  }
  for(const ds of days){
    const w = dowOf(ds);
    const isOff = off.has(ds);
    const mine = shiftsOn(ds, d.id);
    const b = el("button",
      [[0,6].includes(w)?"we":"", isOff?"off":"", mine.length?"sched":""].filter(Boolean).join(" "),
      String(fromIso(ds).getDate()));
    b.title = fmtShort(ds)
      + (isOff ? " — requested off" : "")
      + (mine.length ? ` — scheduled ${SLOTS[mine[0]].label}` : "");
    b.addEventListener("click", ev=>{
      const anchor = lastReqClick[d.id];
      if(ev.shiftKey && anchor){
        const [a,z] = anchor<=ds ? [anchor,ds] : [ds,anchor];
        const turnOn = !isOff;
        let c=a, guard=0;
        while(c<=z && guard++<400){ setReq(d.id,c,turnOn); c=addDays(c,1); }
      } else {
        setReq(d.id, ds, !isOff);
      }
      lastReqClick[d.id] = ds;
      save(); redraw(); render();
    });
    mini.appendChild(b);
  }
  wrap.appendChild(mini);
  return wrap;
}

/* ---- Spike 3 for one day ---- */
function spikeCheck(id, ds, idx){
  const doc = docById(id); const out=[];
  if(!doc) return out;
  if(S.rules.onPto!==false && isPTO(id,ds))
    out.push({code:"pto", msg:`${id} requested ${fmtShort(ds)} off`});
  const other = shiftsOn(ds,id).filter(k=>k!=="spk");
  const otherSpike = spikeOn(ds).some((e,i)=>i!==idx && e.doc===id);
  if(S.rules.onOneADay!==false && (other.length || otherSpike))
    out.push({code:"double", msg:other.length
      ? `${id} already has ${SLOTS[other[0]].label} that day`
      : `${id} already has a Spike 3 that day`});
  const rec = S.rules.onRecovery!==false;
  const off = rec ? (S.rules.nightOffDays|0) : 0;
  const early = rec ? (S.rules.nightEarlyDays|0) : 0;
  if(rec){
    let flagged=false;
    for(let k=1;k<=off;k++)
      if(at(addDays(ds,-k),"noc")===id){
        out.push({code:"nightrec", msg:`${id} worked the overnight ${fmtShort(addDays(ds,-k))} — the ${off} days after are fully off`});
        flagged=true; break;
      }
    if(!flagged){
      const entry = spikeOn(ds)[idx];
      const startH = entry ? (spikeTime(entry.t)||{start:14}).start : 14;
      if(startH < 12) for(let k=off+1;k<=early;k++)
        if(at(addDays(ds,-k),"noc")===id){
          out.push({code:"nightearly", msg:`${id} came off an overnight ${fmtShort(addDays(ds,-k))} — nothing starting before noon yet`});
          break;
        }
    }
  }
  return out;
}

/* ---- coverage for one single day ---- */
function openDaySetup(ds){
  const d = fromIso(ds);
  const {m, body, foot} = modalShell(
    d.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}),
    "Add or remove shifts for this one day");

  const note = el("div","hint"); note.style.marginBottom="10px";
  body.appendChild(note);
  const host = el("div"); body.appendChild(host);

  function draw(){
    const now = slotsFor(ds), base = monthShapeFor(ds);
    host.innerHTML = "";
    const list = el("div","dayslots");
    for(const k of SLOT_ORDER){
      const on = now.includes(k), inBase = base.includes(k);
      const who = at(ds,k);
      const row = el("button","dayslot"+(on?" on":"")+(SLOTS[k].overnight?" noc":""));
      const left = el("div","ds-l");
      left.appendChild(el("span","ds-mark", on?"●":"○"));
      left.appendChild(el("span","ds-name", SLOTS[k].label));
      row.appendChild(left);
      const right = el("div","ds-r");
      if(on && who){
        const chip = el("span","ds-doc", who);
        const doc = docById(who); if(doc) tintEl(chip, doc.color);
        right.appendChild(chip);
      } else if(on){
        right.appendChild(el("span","hint","open"));
      }
      if(on !== inBase) right.appendChild(el("span","ds-tag", on?"added":"removed"));
      row.appendChild(right);
      row.addEventListener("click", ()=>{
        const next = now.slice();
        const i = next.indexOf(k);
        if(i>=0){
          if(who && !confirm(`${who} is on ${SLOTS[k].label} this day. Remove the shift and unassign them?`)) return;
          if(who) assign(ds,k,null);
          next.splice(i,1);
        } else next.push(k);
        setDaySlots(ds, next);
        save(); draw(); render();
      });
      list.appendChild(row);
    }
    host.appendChild(list);
    const nowN = slotsFor(ds).length, baseN = base.length;
    note.textContent = dayIsCustom(ds)
      ? `${nowN} doctor${nowN===1?"":"s"} this day — the rest of ${DOW[d.getDay()]}s run ${baseN}.`
      : `${nowN} doctor${nowN===1?"":"s"}, the same as every other ${DOW[d.getDay()]} this month.`;
  }
  draw();

  const reset = el("button","btn","Match the month");
  reset.addEventListener("click", ()=>{
    const base = monthShapeFor(ds), now = slotsFor(ds);
    const losing = now.filter(k=>!base.includes(k) && at(ds,k));
    if(losing.length && !confirm(`This unassigns ${losing.length} placed shift${losing.length>1?"s":""}. Continue?`)) return;
    losing.forEach(k=>assign(ds,k,null));
    if(S.days) delete S.days[ds];
    save(); draw(); render();
  });
  foot.appendChild(reset);
  const toMonth = el("button","btn","Change every "+DOW[d.getDay()]);
  toMonth.title = "Open the month's coverage instead";

  const done=el("button","btn primary","Done"); done.addEventListener("click", ()=>{closeModal();render();});

}

/* ---- per-month coverage shape ---- */
function openMonthSetup(){
  const label = new Date(S.view.y,S.view.m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const {m, body, foot} = modalShell(label + " coverage",
    "Which shifts run on which weekday, for this month only", true);

  const lede = el("div","hint"); lede.style.marginBottom="10px";
  lede.textContent = "Every other month keeps the standard shape. Turning a shift off will unassign anyone already placed on it.";
  body.appendChild(lede);

  const host = el("div"); body.appendChild(host);
  const summary = el("div","hint"); summary.style.marginTop="10px"; body.appendChild(summary);

  function draw(){
    const custom = !!(S.months[monthKey(S.view.y,S.view.m)]||{}).tpl;
    const tpl = custom ? S.months[monthKey(S.view.y,S.view.m)].tpl : TEMPLATE;
    host.innerHTML="";
    const g = el("div","cov");
    g.appendChild(el("div","cov-h",""));
    DOW3.forEach((d,w)=> g.appendChild(el("div","cov-h"+([0,6].includes(w)?" we":""), d)));
    for(const k of SLOT_ORDER){
      g.appendChild(el("div","cov-r"+(SLOTS[k].overnight?" noc":""), SLOTS[k].label));
      for(let w=0;w<7;w++){
        const on = (tpl[w]||[]).includes(k);
        const b = el("button","cov-c"+(on?" on":""), on?"●":"");
        b.title = `${SLOTS[k].label} on ${DOW[w]}s`;
        b.addEventListener("click", ()=> toggle(k,w));
        g.appendChild(b);
      }
    }
    // per-weekday totals
    g.appendChild(el("div","cov-r tot","doctors"));
    for(let w=0;w<7;w++)
      g.appendChild(el("div","cov-c tot"+([0,6].includes(w)?" we":""), String((tpl[w]||[]).length)));
    host.appendChild(g);

    const total = monthDays(S.view.y,S.view.m).reduce((n,ds)=>n+slotsFor(ds).length,0);
    const targets = activeRoster().reduce((n,d)=>n+(+d.target||0),0);
    summary.textContent = `${total} shifts this month against ${targets} preferred across the roster`
      + (custom ? " · custom shape" : " · standard shape");
  }

  function toggle(slot, w){
    const tpl = ensureMonthTpl(S.view.y,S.view.m);
    const list = tpl[w] || (tpl[w]=[]);
    const i = list.indexOf(slot);
    if(i>=0){
      const hit = monthDays(S.view.y,S.view.m).filter(ds=> dowOf(ds)===w && at(ds,slot));
      if(hit.length && !confirm(
        `${SLOTS[slot].label} on ${DOW[w]}s currently has ${hit.length} doctor${hit.length>1?"s":""} placed. Remove the shift and unassign them?`
      )) return;
      hit.forEach(ds=> assign(ds,slot,null));
      list.splice(i,1);
    } else {
      list.push(slot);
    }
    save(); draw(); render();
  }

  draw();

  const reset = el("button","btn","Standard shape");
  reset.addEventListener("click", ()=>{
    const total = monthDays(S.view.y,S.view.m).reduce((n,ds)=>n+slotsFor(ds).length,0);
    if(!confirm("Reset this month to the standard weekday shape? Anyone on a shift that disappears will be unassigned.")) return;
    delete S.months[monthKey(S.view.y,S.view.m)];
    monthDays(S.view.y,S.view.m).forEach(ds=>{ if(S.days) delete S.days[ds]; });
    for(const ds of monthDays(S.view.y,S.view.m)){
      const keep = new Set(slotsFor(ds));
      for(const k of SLOT_ORDER) if(!keep.has(k) && at(ds,k)) assign(ds,k,null);
    }
    save(); draw(); render();
  });
  foot.appendChild(reset);

  const py = S.view.m===0 ? S.view.y-1 : S.view.y, pm = S.view.m===0 ? 11 : S.view.m-1;
  const copy = el("button","btn", "Copy " + new Date(py,pm,1).toLocaleDateString(undefined,{month:"short"}));
  copy.title = "Use last month's shape";
  copy.addEventListener("click", ()=>{
    const src = templateFor(py,pm);
    const tpl = ensureMonthTpl(S.view.y,S.view.m);
    for(let w=0;w<7;w++) tpl[w] = (src[w]||[]).slice();
    for(const ds of monthDays(S.view.y,S.view.m)){
      const keep = new Set(slotsFor(ds));
      for(const k of SLOT_ORDER) if(!keep.has(k) && at(ds,k)) assign(ds,k,null);
    }
    save(); draw(); render();
  });
  foot.appendChild(copy);

  foot.appendChild(el("span","spacer"));
  const done=el("button","btn primary","Done"); done.addEventListener("click", ()=>{closeModal();render();});
  foot.appendChild(done);
  showModal(m);
}

/* ---- rules ---- */
function openRules(){
  const {m, body, foot} = modalShell("Rules",
    "Everything the board enforces, editable from here", true);

  const host = el("div"); body.appendChild(host);

  function draw(){
    host.innerHTML = "";

    /* --- hard rules --- */
    host.appendChild(el("div","pgroup","Hard rules — placement is blocked"));
    const hard = el("div");
    hard.appendChild(ruleToggle("onPto","Requests off",
      "A day a doctor asked for cannot be scheduled."));
    hard.appendChild(ruleToggle("onNight","Overnight eligibility",
      "Doctors marked day-only cannot be given a 6p–6a."));
    hard.appendChild(ruleToggle("onOneADay","One shift per doctor per day",
      "Nobody can hold two shifts on the same date."));
    hard.appendChild(ruleToggle("onRecovery","Night recovery",
      `The ${S.rules.nightOffDays} days after an overnight are fully off; on day ${S.rules.nightOffDays+1} they return at 12p–12a or later; anything starting before noon waits until day ${S.rules.nightEarlyDays+1}.`));
    if(S.rules.onRecovery!==false){
      const sub = el("div"); sub.style.cssText="padding-left:24px";
      sub.appendChild(numField("Full days off after an overnight","nightOffDays",0));
      sub.appendChild(numField("Days before a shift starting before noon","nightEarlyDays",0));
      hard.appendChild(sub);
    }
    host.appendChild(hard);

    /* --- monthly minimums and maximums --- */
    host.appendChild(el("div","pgroup","Monthly minimums and maximums"));
    const qhost = el("div");
    const capy = quotaCapacity(S.view.y,S.view.m);
    const capOf = id => capy.find(c=>c.rule.id===id);
    (S.rules.quotas||[]).forEach((r,idx)=>{
      const card = el("div","rulecard"+(r.on===false?" off":""));
      const top = el("div","rule-top");
      const chk = el("input"); chk.type="checkbox"; chk.checked = r.on!==false;
      chk.addEventListener("change", ()=>{ r.on=chk.checked; save(); draw(); render(); });
      top.appendChild(chk);
      top.appendChild(el("span","rule-txt", quotaLabel(r)));
      const rm = el("button","btn danger","×"); rm.title="Delete this rule";
      rm.addEventListener("click", ()=>{
        if(!confirm("Delete this rule?")) return;
        S.rules.quotas.splice(idx,1); save(); draw(); render();
      });
      top.appendChild(rm);
      card.appendChild(top);

      const ed = el("div","rule-edit");
      ed.appendChild(pick(["min","max"],["at least","at most"], r.kind, v=>{ r.kind=v; }));
      const num = el("input"); num.type="number"; num.min="0"; num.value=r.count;
      num.style.cssText="width:58px;flex:none";
      num.addEventListener("input", ()=>{ r.count=Math.max(0,parseInt(num.value,10)||0); save(); draw(); render(); });
      ed.appendChild(num);
      // what is being counted
      const whatVals = ["any"].concat(DOW3.map((_,i)=>"w"+i)).concat(SLOT_ORDER.map(k=>"s"+k));
      const whatText = ["shifts"].concat(DOW.map(d=>d+"s")).concat(SLOT_ORDER.map(k=>SLOTS[k].label));
      const cur = r.what.type==="weekday" ? "w"+r.what.weekday : r.what.type==="slot" ? "s"+r.what.slot : "any";
      ed.appendChild(pick(whatVals, whatText, cur, v=>{
        r.what = v==="any" ? {type:"any"}
               : v[0]==="w" ? {type:"weekday", weekday:+v.slice(1)}
               : {type:"slot", slot:v.slice(1)};
      }));
      const whoVals = ["all","dayonly","night"].concat(activeRoster().map(d=>d.id));
      const whoText = ["every doctor","day-only doctors","overnight doctors"].concat(activeRoster().map(d=>d.initials+" only"));
      ed.appendChild(pick(whoVals, whoText, r.who, v=>{ r.who=v; }));
      card.appendChild(ed);

      const c = capOf(r.id);
      if(r.on!==false && c && r.kind==="min"){
        const f = el("div","hint");
        f.textContent = c.fits
          ? `Fits this month — ${c.slots} available against ${c.need} needed.`
          : `Not reachable this month — only ${c.slots} available against ${c.need} needed, so at most ${c.maxDocs} of ${c.n} can get there.`;
        if(!c.fits) f.style.color = "var(--warn-fg)";
        card.appendChild(f);
      }
      qhost.appendChild(card);
    });
    const add = el("button","btn","+ Add a rule");
    add.addEventListener("click", ()=>{
      S.rules.quotas = S.rules.quotas||[];
      S.rules.quotas.push({id:"r"+Date.now().toString(36), on:true, kind:"min", count:1,
        what:{type:"any"}, who:"all"});
      save(); draw(); render();
    });
    qhost.appendChild(add);
    qhost.appendChild(el("div","hint","Counted over the whole month, so these are not placement blocks — the board reports who falls short and auto-fill chases them."));
    host.appendChild(qhost);

    /* --- soft rules --- */
    host.appendChild(el("div","pgroup","Soft rules — flagged, never blocked"));
    const soft = el("div");
    soft.appendChild(numField("Overnights in a row before warning","maxConsecNights"));
    soft.appendChild(numField("Days worked in a row before warning","maxConsecDays"));
    soft.appendChild(boolField("Warn when a doctor passes their preferred total","warnOverTarget"));
    soft.appendChild(el("div","hint","Blocked weekdays and shift rankings live on each doctor's card under Doctors."));
    host.appendChild(soft);

    /* --- auto-fill --- */
    host.appendChild(el("div","pgroup","Auto-fill"));
    const af = el("div");
    const ps = el("div","f-row");
    const psl = el("div"); psl.style.cssText="flex:1;font-size:12.5px;color:var(--ink-2)";
    psl.textContent = "How hard to chase each doctor's shift ranking";
    ps.appendChild(psl);
    ps.appendChild(pick(["balanced","strong"],
      ["Balanced — spread the load","Follow preferences closely"],
      S.rules.prefStrength, v=>{ S.rules.prefStrength=v; }));
    af.appendChild(ps);
    af.appendChild(el("div","hint","Balanced shares weekends and overnights evenly. Following preferences closely lets specialists form — a doctor who ranks 6p–6a first takes most of the nights."));
    host.appendChild(af);

    /* --- coverage + override --- */
    host.appendChild(el("div","pgroup","Coverage"));
    host.appendChild(el("div","hint","Click the month name at the top of the board to change which shifts run on which weekday, or click any date to change that one day."));

    host.appendChild(el("div","pgroup","Spike 3 times"));
    const st = el("div");
    st.appendChild(el("div","hint","The hours a Spike 3 can run. Pick from these when scheduling one; a Spike 3 does not count toward the day's coverage, but does count toward that doctor's monthly total."));
    (S.spikeTimes||[]).forEach((t,i)=>{
      const row = el("div","spktime");
      const lab = el("input"); lab.type="text"; lab.value=t.label; lab.placeholder="2p–8p";
      lab.addEventListener("input", ()=>{ t.label=lab.value; save(); render(); });
      row.appendChild(lab);
      const mk = (key,ph)=>{
        const n=el("input"); n.type="number"; n.min="0"; n.max="30"; n.value=t[key];
        n.style.cssText="width:62px;flex:none"; n.title=ph;
        n.addEventListener("input", ()=>{ t[key]=Math.max(0,parseInt(n.value,10)||0); save(); render(); });
        return n;
      };
      row.appendChild(el("span","hint","start"));
      row.appendChild(mk("start","start hour, 24h"));
      row.appendChild(el("span","hint","end"));
      row.appendChild(mk("end","end hour, 24h"));
      const rm=el("button","btn danger","×");
      rm.addEventListener("click", ()=>{ S.spikeTimes.splice(i,1); save(); draw(); render(); });
      row.appendChild(rm);
      st.appendChild(row);
    });
    const addT = el("button","btn","+ Add a time");
    addT.addEventListener("click", ()=>{
      S.spikeTimes = S.spikeTimes||[];
      S.spikeTimes.push({id:"s"+Date.now().toString(36), label:"New", start:14, end:20});
      save(); draw(); render();
    });
    st.appendChild(addT);
    host.appendChild(st);
    host.appendChild(el("div","pgroup","Override"));
    const ov = el("div");
    ov.appendChild(boolField("Allow me to place a doctor despite a hard rule","allowOverride"));
    ov.appendChild(el("div","hint","Off by default. The placement still shows a red flag when you use it."));
    host.appendChild(ov);
  }

  function ruleToggle(key,title,desc){
    const card = el("div","rulecard"+(S.rules[key]===false?" off":""));
    const top = el("div","rule-top");
    const chk = el("input"); chk.type="checkbox"; chk.checked = S.rules[key]!==false;
    chk.addEventListener("change", ()=>{ S.rules[key]=chk.checked; save(); draw(); render(); });
    top.appendChild(chk);
    top.appendChild(el("span","rule-txt", title));
    card.appendChild(top);
    card.appendChild(el("div","hint", desc));
    return card;
  }
  function pick(vals, texts, cur, on){
    const sel = el("select"); sel.style.cssText="width:auto;flex:none";
    vals.forEach((v,i)=>{ const o=el("option","",texts[i]); o.value=v; if(v===cur) o.selected=true; sel.appendChild(o); });
    sel.addEventListener("change", ()=>{ on(sel.value); save(); draw(); render(); });
    return sel;
  }
  function numField(label,key,min){
    const lo = min===undefined ? 1 : min;
    const w=el("div","f-row");
    const l=el("div"); l.style.cssText="flex:1;font-size:12.5px;color:var(--ink-2)"; l.textContent=label;
    const i=el("input"); i.type="number"; i.min=String(lo); i.value=S.rules[key];
    i.style.cssText="width:70px;flex:none";
    i.addEventListener("input", ()=>{
      const v=parseInt(i.value,10);
      S.rules[key]= Number.isFinite(v) ? Math.max(lo,v) : lo;
      save(); render();
    });
    w.append(l,i); return w;
  }
  function boolField(label,key){
    const w=el("label","chk"); w.style.cssText="display:flex;gap:8px;padding:5px 0;font-size:12.5px";
    const i=el("input"); i.type="checkbox"; i.checked=!!S.rules[key];
    i.addEventListener("change", ()=>{ S.rules[key]=i.checked; save(); render(); });
    w.appendChild(i); w.appendChild(document.createTextNode(label)); return w;
  }

  draw();
  const reset = el("button","btn danger","Reset to defaults");
  reset.addEventListener("click", ()=>{
    if(!confirm("Put every rule back to how it shipped?")) return;
    S.rules = {...DEFAULT_RULES, quotas:DEFAULT_RULES.quotas.map(q=>({...q, what:{...q.what}}))};
    save(); draw(); render();
  });
  foot.appendChild(reset);
  foot.appendChild(el("span","spacer"));
  const done=el("button","btn primary","Done"); done.addEventListener("click", ()=>{closeModal();render();});
  foot.appendChild(done);
  showModal(m);
}

/* ---- data ---- */
const SETUP_SQL = `create table if not exists schedules (
  id          text primary key,
  version     integer not null default 1,
  data        jsonb   not null default '{}'::jsonb,
  updated_at  timestamptz default now()
);

alter table schedules enable row level security;

create policy "read schedules"   on schedules for select using (true);
create policy "insert schedules" on schedules for insert with check (true);
create policy "update schedules" on schedules for update using (true);`;

function openSharing(){
  const {m, body, foot} = modalShell("Sharing",
    "Put the schedule in a Supabase project so it survives new devices and reaches your team", true);

  const cfg = Object.assign({url:"",key:"",table:"schedules",id:"clifton"}, Cloud.cfg||{});

  const state = el("div","hint"); state.style.marginBottom="10px";
  const restate = ()=>{
    state.textContent = Cloud.on
      ? `Connected · version ${Cloud.version} · ${SYNC_TEXT[Cloud.status][0].toLowerCase()}`
        + (Cloud.lastError ? ` · last error: ${Cloud.lastError}` : "")
      : "Not connected. The board is saving to this browser only, which no one else can see.";
  };
  restate(); body.appendChild(state);

  body.appendChild(el("div","pgroup","1 · Create the table"));
  const p1 = el("div","hint");
  p1.innerHTML = "In your Supabase project open <b>SQL Editor</b>, paste this and run it. It makes one table the board reads and writes.";
  body.appendChild(p1);
  const pre = el("pre","sql"); pre.textContent = SETUP_SQL; body.appendChild(pre);
  const cp = el("button","btn","Copy the SQL");
  cp.addEventListener("click", ()=>{
    navigator.clipboard.writeText(SETUP_SQL).then(
      ()=>{ cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy the SQL",1500); },
      ()=>{ cp.textContent="Select it manually"; });
  });
  body.appendChild(cp);

  body.appendChild(el("div","pgroup","2 · Point the board at it"));
  const p2 = el("div","hint");
  p2.innerHTML = "From <b>Project Settings → API</b>: the Project URL, and the <b>anon public</b> key — not the service_role key, which must never go in a web page.";
  body.appendChild(p2);

  const f = el("div");
  const field = (label,key,ph)=>{
    const w=el("div"); w.style.marginBottom="8px";
    w.appendChild(el("label","fl",label));
    const i=el("input"); i.type="text"; i.value=cfg[key]||""; i.placeholder=ph||"";
    i.addEventListener("input",()=>{ cfg[key]=i.value.trim(); });
    w.appendChild(i); return w;
  };
  f.appendChild(field("Project URL","url","https://xxxxxxxx.supabase.co"));
  f.appendChild(field("Anon public key","key","eyJhbGciOi…"));
  const row = el("div","f-row");
  const t1=field("Table","table","schedules"), t2=field("Schedule name","id","clifton");
  t1.style.flex="1"; t2.style.flex="1"; row.append(t1,t2);
  f.appendChild(row);
  body.appendChild(f);

  const out = el("div"); out.style.marginTop="8px"; body.appendChild(out);
  const say = (txt, bad)=>{ out.innerHTML=""; const d=el("div","hint"); d.style.color = bad?"var(--crit)":"var(--good)"; d.textContent=txt; out.appendChild(d); };

  const test = el("button","btn","Test connection");
  test.addEventListener("click", async ()=>{
    if(!cfg.url || !cfg.key){ say("Fill in both the URL and the key first.", true); return; }
    test.disabled=true; test.textContent="Testing…";
    const prev = Cloud.cfg; Cloud.cfg = {...cfg};
    try{
      const row = await Cloud.fetchRow();
      say(row ? `Reached the table. A schedule named "${cfg.id}" already exists there at version ${row.version}.`
              : `Reached the table. No schedule named "${cfg.id}" yet — connecting will create it.`);
    }catch(e){
      say("Could not reach it: "+String(e.message||e).slice(0,200), true);
      Cloud.cfg = prev;
    }
    test.disabled=false; test.textContent="Test connection";
  });

  const connect = el("button","btn primary","Connect");
  connect.addEventListener("click", async ()=>{
    if(!cfg.url || !cfg.key){ say("Fill in both the URL and the key first.", true); return; }
    connect.disabled=true; connect.textContent="Connecting…";
    saveCloudCfg({...cfg});
    try{
      const row = await Cloud.fetchRow();
      if(!row){
        await Cloud.createRow();
        say("Connected. This board has been uploaded as the starting point.");
      } else if(confirm(
        `A schedule already exists in the database (version ${row.version}).\n\n` +
        `OK — use the database copy and replace what is on this device.\n` +
        `Cancel — push what is on this device up, overwriting the database.`)){
        adoptShared(row.data); Cloud.version = row.version;
        say("Connected. Pulled the schedule down from the database.");
      } else {
        Cloud.version = row.version; await Cloud.push();
        say("Connected. Pushed this device's schedule up.");
      }
      Cloud.startPolling(); render(); restate();
    }catch(e){
      say("Could not connect: "+String(e.message||e).slice(0,200), true);
      saveCloudCfg(null); setSync("local");
    }
    connect.disabled=false; connect.textContent="Connect";
  });

  const off = el("button","btn danger","Disconnect");
  off.addEventListener("click", ()=>{
    if(!confirm("Stop syncing? The schedule stays in the database and on this device, but they will drift apart.")) return;
    saveCloudCfg(null); clearInterval(Cloud.pollT); setSync("local"); restate();
  });

  body.appendChild(el("div","pgroup","3 · So nobody else has to do this"));
  const p3 = el("div","hint"); p3.style.lineHeight="1.55";
  p3.innerHTML = "Drop a file called <b>hc-config.json</b> next to the page in your GitHub repo and everyone who opens the site is connected automatically:";
  body.appendChild(p3);
  const cfgPre = el("pre","sql");
  const cfgJson = ()=> JSON.stringify({url:cfg.url||"https://xxxxxxxx.supabase.co",
    key:cfg.key||"eyJhbGciOi…", table:cfg.table||"schedules", id:cfg.id||"clifton"}, null, 2);
  cfgPre.textContent = cfgJson();
  body.appendChild(cfgPre);
  const cp2 = el("button","btn","Copy hc-config.json");
  cp2.addEventListener("click", ()=>{
    cfgPre.textContent = cfgJson();
    navigator.clipboard.writeText(cfgJson()).then(
      ()=>{ cp2.textContent="Copied"; setTimeout(()=>cp2.textContent="Copy hc-config.json",1500); },
      ()=>{ cp2.textContent="Select it manually"; });
  });
  body.appendChild(cp2);

  body.appendChild(el("div","pgroup","Worth knowing"));
  const warn = el("div","hint"); warn.style.lineHeight="1.55";
  warn.textContent = "The anon key sits in the page, so anyone with your site address can read and edit the schedule. That is normally fine for shift initials on an internal tool, but do not put anything confidential in the notes fields. If you want it locked down, Supabase Auth with a row-level policy of auth.role() = 'authenticated' will require each person to sign in — say the word and I will wire that up. Edits save about half a second after you stop, and the board re-checks the database every 12 seconds. If two people save at the same moment the later save wins and the other person's board refreshes with a notice.";
  body.appendChild(warn);

  foot.append(test, connect, el("span","spacer"));
  if(Cloud.on) foot.appendChild(off);
  const done=el("button","btn","Close"); done.addEventListener("click", closeModal);
  foot.appendChild(done);
  showModal(m);
}

  const ver = el("div","hint");
  ver.textContent = `Herding Cats ${APP_VERSION} · ${APP_BUILT}` +
    (Cloud.on ? ` · syncing, schedule version ${Cloud.version}` : " · this device only");
  body.appendChild(ver);
  foot.appendChild(el("span","hint","Export a JSON backup before switching devices or clearing your browser."));
  showModal(m);
}
function download(name, text, type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCsv(){
  const rows=[["Date","Weekday","Slot","Doctor","NERDs"]];
  for(const ds of monthDays(S.view.y,S.view.m)){
    for(const slot of slotsFor(ds)){
      const nn = nerdsOn(ds,slot).map(x=>(nerdById(x)||{}).initials||x).join(" ");
      rows.push([ds, DOW[dowOf(ds)], SLOTS[slot].label.replace("–","-"), at(ds,slot)||"OPEN", nn]);
    }
    for(const e of spikeOn(ds)){
      const t = spikeTime(e.t);
      rows.push([ds, DOW[dowOf(ds)], "Spike 3 "+((t&&t.label)||"").replace("–","-"), e.doc||"OPEN", ""]);
    }
  }
  const csv = rows.map(r=>r.map(c=>/[",]/.test(c)?`"${c.replace(/"/g,'""')}"`:c).join(",")).join("\n");
  download(`herding-cats-${S.view.y}-${pad(S.view.m+1)}.csv`, csv, "text/csv");
}
function exportJson(){ download("herding-cats-backup.json", JSON.stringify(S,null,2), "application/json"); }
function importJson(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
  i.addEventListener("change", ()=>{
    const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const s=JSON.parse(r.result);
        if(!s.roster) throw new Error("not a backup");
        S=s; S.rules={...DEFAULT_RULES,...(S.rules||{})};
        save(); closeModal(); render();
      }catch(e){ flashBlock("That file could not be read as a backup"); }
    };
    r.readAsText(f);
  });
  i.click();
}

/* ============================================================
   8. WIRING
   ============================================================ */

$("#prevM").addEventListener("click", ()=>{ let{y,m}=S.view; m--; if(m<0){m=11;y--;} S.view={y,m}; render(); });
$("#nextM").addEventListener("click", ()=>{ let{y,m}=S.view; m++; if(m>11){m=0;y++;} S.view={y,m}; render(); });
$("#btnToday").addEventListener("click", ()=>{ const d=new Date(); S.view={y:d.getFullYear(),m:d.getMonth()}; render(); });
$("#mLabel").addEventListener("click", openMonthSetup);
$("#btnAuto").addEventListener("click", openAutofill);
$("#btnRoster").addEventListener("click", openRoster);
$("#btnRules").addEventListener("click", openRules);
$("#btnData").addEventListener("click", openData);
$("#btnShare").addEventListener("click", openSharing);

/* theme — resolved once so there is a single source of truth, then remembered */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#btnTheme").textContent = t==="dark" ? "☀" : "☾";
  $("#btnTheme").title = t==="dark" ? "Switch to light" : "Switch to dark";
}
if(!S.theme) S.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
applyTheme(S.theme);
$("#btnTheme").addEventListener("click", ()=>{
  S.theme = S.theme==="dark" ? "light" : "dark";
  applyTheme(S.theme); save();
});
$("#armX").addEventListener("click", ()=> toggleArm(armed));

// On narrow screens the side panels sit above the calendar and start folded,
// so the month is still the first thing you see.
const NARROW = ()=> window.matchMedia("(max-width:860px)").matches;
document.querySelectorAll(".panel.foldable").forEach(p=>{
  if(NARROW()) p.classList.add("folded");
  p.querySelector(".panel-h").addEventListener("click", ()=>{
    if(NARROW()) p.classList.toggle("folded");
  });
});
window.addEventListener("resize", ()=>{
  if(!NARROW()) document.querySelectorAll(".panel.foldable").forEach(p=>p.classList.remove("folded"));
});

render();

/* boot the shared layer after first paint so the board never waits on network */
(async ()=>{
  Cloud.cfg = loadCloudCfg();
  // If the site is deployed with an hc-config.json beside it, everyone who opens
  // the page is connected automatically — no one has to paste a key.
  if(!Cloud.on && /^https?:$/.test(location.protocol)){
    try{
      const r = await fetch("hc-config.json", {cache:"no-store"});
      if(r.ok){
        const c = await r.json();
        if(c && c.url && c.key) saveCloudCfg({table:"schedules", id:"clifton", ...c});
      }
    }catch(e){ /* no config file deployed — stay local */ }
  }
  saveLocal();
  if(Cloud.on){
    setSync("saving");
    await Cloud.pull();
    Cloud.startPolling();
    render();
  } else {
    setSync("local");
  }
})();
// a tab coming back into focus should catch up
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && Cloud.on && !pendingPush) Cloud.pull();
});
</script>
