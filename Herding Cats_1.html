<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herding Cats — VEG ER for Pets</title>
<style>
/* VEG ER for Pets — brand red #eb2429, deep burgundy #6d0614, light blue accent.
   Brand red carries identity and primary actions; hard violations use the deeper
   burgundy so an error never reads as chrome; data meters use the blue. */
:root{
  color-scheme: light;
  --paper:#faf4f2; --surface:#ffffff; --surface-2:#f6eeeb;
  --ink:#1a0f10; --ink-2:#5b4a4b; --ink-3:#94807f;
  --rule:#eddfdb; --line:#dcc9c5;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#6d0614;
  --brand:#eb2429; --brand-mid:#f4888b; --brand-soft:#fdeceb; --brand-deep:#b81f24;
  --accent:#3a86c0; --accent-soft:#dcecf7; --accent-mid:#8fbfdf; --accent-deep:#24506e;
  --ring:rgba(26,15,16,.12);
  --shadow:0 1px 2px rgba(109,6,20,.07), 0 8px 26px rgba(109,6,20,.09);
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  /* status pills */
  --amber-bg:#fdf2d9; --amber-bd:#e0bd68; --amber-fg:#8a5d05; --warn-fg:#96660a;
  --clash-bg:#f8e3e5; --clash-bd:#c98d95; --clash-fg:#6d0614;
  --ok-bg:#e4f5e4;    --ok-fg:#0a6b0a;
  --veil:rgba(26,15,16,.34);
  --hatch:#f8f0ed;
}
/* Dark mode is its own set of steps chosen against the dark surface, not an
   inverted copy of the light values. Every step clears 3:1 on --surface. */
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#120c0c; --surface:#1c1413; --surface-2:#291d1c;
  --ink:#fdf6f5; --ink-2:#cbb8b6; --ink-3:#9b8785;
  --rule:#362726; --line:#4b3835;
  --good:#22b722; --warn:#fab219; --serious:#ec835a; --crit:#ef6b6b;
  --brand:#f4534f; --brand-mid:#a83a3a; --brand-soft:#3a1a1a; --brand-deep:#ff8b84;
  --accent:#63a8dc; --accent-soft:#1e3448; --accent-mid:#3f6f95; --accent-deep:#8fc4e8;
  --ring:rgba(255,255,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.45);
  --amber-bg:#3a2c10; --amber-bd:#7a5c1c; --amber-fg:#f0c159; --warn-fg:#e0ab3c;
  --clash-bg:#3d1c1e; --clash-bd:#7d3f44; --clash-fg:#f28c8c;
  --ok-bg:#12331a;    --ok-fg:#5fd45f;
  --veil:rgba(0,0,0,.6);
  --hatch:#241a19;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:60; background:var(--surface);
  border-bottom:1px solid var(--rule); padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{
  background:var(--brand);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;
  padding:4px 8px;border-radius:7px;line-height:1.15;flex:none;
}
.brand .txt{display:flex;flex-direction:column;line-height:1.15}
.brand h1{font-size:15px}
.brand .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase}
.monthnav{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);overflow:hidden}
.monthnav button{padding:6px 11px;color:var(--ink-2);font-size:15px;line-height:1}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{padding:6px 12px;font-weight:600;font-size:13.5px;min-width:148px;text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule);color:var(--ink)}
.monthnav .mlabel:hover{background:var(--brand-soft);color:var(--brand-deep)}
.cov{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr));gap:3px}
.cov-h{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:center;padding-bottom:2px}
.cov-h.we{color:var(--brand-deep)}
.cov-r{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-variant-numeric:tabular-nums}
.cov-r.noc{color:var(--accent-deep);font-weight:600}
.cov-c{height:27px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:transparent;font-size:11px;line-height:25px;text-align:center}
.cov-c:hover{border-color:var(--brand-mid);background:var(--brand-soft)}
.cov-c.on{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent-deep)}
.cov-c.on:hover{background:var(--brand-soft);border-color:var(--brand-mid)}
.cov-r.tot,.cov-c.tot{font-size:11px;font-weight:700;color:var(--ink-3);border:none;background:none;height:22px;line-height:22px}
.cov-c.tot{text-align:center;color:var(--ink-2)}
.cov-c.tot.we{color:var(--brand-deep)}
.prefbox{margin-top:8px}
.prefsum{display:flex;align-items:center;gap:6px;width:100%;font-size:11.5px;color:var(--ink-3);text-align:left;padding:3px 0}
.prefsum b{color:var(--ink-2);font-weight:600}
.prefsum .ed{margin-left:auto;color:var(--accent);white-space:nowrap}
.preflist{margin-top:5px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.prefrow{display:flex;align-items:center;gap:7px;padding:3px 7px;font-size:11.5px;border-bottom:1px solid var(--rule)}
.prefrow:last-child{border-bottom:none}
.prefrow .r{width:15px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:10.5px}
.prefrow .l{flex:1;color:var(--ink-2)}
.prefrow.top .l{color:var(--ink);font-weight:600}
.prefrow .mv{border:1px solid var(--rule);border-radius:5px;width:20px;height:19px;line-height:17px;text-align:center;color:var(--ink-3);font-size:10px}
.prefrow .mv:hover{border-color:var(--accent-mid);color:var(--accent);background:var(--accent-soft)}
.prefrow .mv[disabled]{opacity:.3;pointer-events:none}
.pick .pref{font-size:10.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.btn{
  border:1px solid var(--rule); border-radius:8px; padding:6px 11px; font-size:13px;
  background:var(--surface); color:var(--ink-2); font-weight:500; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-deep)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-mid);color:#184f95}
.btn.danger{color:var(--crit)}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:16px;padding:16px;align-items:start;max-width:1720px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--rule)}
.panel-h h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.panel-h .spacer{margin-left:auto}
.panel-h .chev{display:none}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:11px 13px 12px}
.tile .lab{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:1px;line-height:1.1}
.tile .val .of{font-size:14px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.tile .note{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.tile.alert .val{color:var(--crit)}
.tile.warnt .val{color:var(--warn-fg)}
.tile.clear .val{color:var(--good)}
.meter{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .18s ease}
.meter.over>i{background:var(--warn)}
.meter.done>i{background:var(--good)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.dow{
  padding:7px 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;background:var(--surface-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:5;
}
.dow.we{color:var(--brand-deep);background:var(--brand-soft)}
.day{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface);min-height:150px;padding:0 0 5px}
.day.out{background:var(--surface-2);opacity:.55}
.day.we{background:color-mix(in srgb, var(--brand-soft) 22%, var(--surface))}
.day-h{display:flex;align-items:center;gap:6px;padding:5px 8px 4px;border-bottom:1px dotted var(--rule);position:relative}
.day-n{font-size:15px;font-weight:600;letter-spacing:-.01em}
.day.today .day-n{background:var(--brand);color:#fff;border-radius:6px;padding:0 6px;margin-left:-4px}
.day-dow{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;display:none}
.day-cnt{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day-cnt.short{color:var(--crit);font-weight:600}
.off-line{
  display:flex;flex-wrap:wrap;align-items:center;gap:3px;
  padding:3px 7px 4px;border-bottom:1px dotted var(--rule);
}
.off-line b{font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.07em;margin-right:1px}
.offchip{
  font-size:10px;font-weight:700;color:var(--amber-fg);background:var(--amber-bg);
  border:1px solid var(--amber-bd);border-radius:4px;padding:0 4px;line-height:15px;
}
.offchip:hover{filter:brightness(1.08) saturate(1.1)}
.offchip.clash{background:var(--clash-bg);border-color:var(--clash-bd);color:var(--clash-fg)}
.offchip.clash:hover{filter:brightness(1.08) saturate(1.1)}
.offadd{
  font-size:11px;color:var(--ink-3);border:1px dashed var(--line);
  border-radius:4px;padding:0 5px;line-height:15px;
}
.offadd:hover{color:var(--brand-deep);border-color:var(--brand-mid);background:var(--brand-soft)}
.day.out .off-line{display:none}

.slot{display:flex;align-items:center;gap:5px;padding:2px 7px;min-height:25px}
.slot .t{font-size:10px;color:var(--ink-3);width:60px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .chip[style*="--tint"]{background:var(--tint-dark);color:var(--ink)}
.dot[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .dot[style*="--tint"]{background:var(--tint-dark)}
.pick .ini[style*="--tint"]{background:var(--tint)}
:root[data-theme="dark"] .pick .ini[style*="--tint"]{background:var(--tint-dark);color:var(--ink)}
.chip{
  flex:1; min-width:0; display:flex; align-items:center; gap:5px;
  border-radius:6px; padding:3px 7px; font-size:12px; font-weight:600;
  border:1px solid var(--ring); background:var(--surface-2); color:var(--ink);
  text-align:left; position:relative; overflow:hidden;
}
.chip:hover{outline:2px solid var(--accent-mid);outline-offset:-1px}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.open{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 5px,var(--hatch) 5px,var(--hatch) 10px);color:var(--ink-3);font-weight:500;border-style:dashed;border-color:var(--line)}
.chip.open:hover{color:var(--ink-2)}
.chip.hard{box-shadow:inset 0 0 0 2px var(--crit)}
.chip.soft{box-shadow:inset 0 0 0 2px var(--warn)}
.flag{margin-left:auto;font-size:10px;font-weight:700;flex:none;line-height:1}
.flag.h{color:var(--crit)}
.flag.s{color:var(--warn-fg)}
.slot.noc .t{color:var(--accent-deep);font-weight:600}

/* armed placement mode */
body.armed .chip.open{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
body.armed .chip:not(.open){opacity:.75}
body.armed .chip.open.noarm{border-color:var(--rule);background:var(--surface);color:var(--ink-3);opacity:.5}
.armbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;
  background:var(--brand);color:#fff;border-radius:999px;padding:9px 12px 9px 14px;
  display:none;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;
}
body.armed .armbar{display:flex}
.armbar .x{background:rgba(255,255,255,.16);border-radius:999px;width:22px;height:22px;color:#fff;font-size:14px;line-height:1}

/* ---------- roster panel ---------- */
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{
  text-align:right;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:7px 6px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
.rtable th:first-child{text-align:left}
.rtable td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.rtable td:first-child{text-align:left}
.rtable tr:last-child td{border-bottom:none}
.rtable tr.picked td{background:var(--brand-soft)}
.rtable tbody tr:hover td{background:var(--surface-2)}
.rname{display:flex;align-items:center;gap:7px;width:100%}
.dot{width:9px;height:9px;border-radius:3px;flex:none;border:1px solid var(--ring)}
.rname .ini{font-weight:600}
.rname .noc-b{font-size:9px;color:var(--accent-deep);background:var(--accent-soft);border-radius:3px;padding:1px 3px;font-weight:700;letter-spacing:.03em}
.cell-meter{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cell-meter .m{width:46px;height:5px;border-radius:3px;background:var(--accent-soft);overflow:hidden;flex:none}
.cell-meter .m>i{display:block;height:100%;background:var(--accent)}
.cell-meter .m.over>i{background:var(--warn)}
.cell-meter .m.done>i{background:var(--good)}
.num.under{color:var(--crit);font-weight:600}
.num.over{color:var(--warn-fg);font-weight:600}
.num.exact{color:var(--good);font-weight:600}
.mut{color:var(--ink-3)}

/* ---------- issues list ---------- */
.issues{max-height:270px;overflow:auto;font-size:12.5px}
.issue{display:flex;gap:8px;padding:7px 13px;border-bottom:1px solid var(--rule);width:100%;text-align:left;align-items:flex-start}
.issue:hover{background:var(--surface-2)}
.issue .bar{width:3px;border-radius:2px;flex:none;align-self:stretch}
.issue.h .bar{background:var(--crit)}
.issue.s .bar{background:var(--warn)}
.issue .d{font-size:11px;color:var(--ink-3);white-space:nowrap}
.issue .m{color:var(--ink-2);line-height:1.35}
.issue .m b{color:var(--ink)}
.empty{padding:16px 14px;color:var(--ink-3);font-size:12.5px;text-align:center}
.empty.ok{color:var(--good)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:var(--veil);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 14px 14px;overflow:auto}
.veil.on{display:flex}
#modalHost{width:100%;display:flex;justify-content:center}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;border:1px solid var(--rule);overflow:hidden}
.modal.wide{max-width:900px}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.modal-h h3{font-size:14px}
.modal-h .sub{font-size:12px;color:var(--ink-3)}
.modal-h .x{margin-left:auto;font-size:20px;color:var(--ink-3);line-height:1;padding:0 4px}
.modal-b{padding:12px 16px;max-height:64vh;overflow:auto}
.modal-f{padding:11px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center}
.modal-f .spacer{margin-left:auto}

/* picker */
.pick{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;border:1px solid transparent;text-align:left;margin-bottom:3px}
.pick:hover{background:var(--surface-2);border-color:var(--rule)}
.pick.blocked{opacity:.62;cursor:not-allowed}
.pick.blocked:hover{background:none;border-color:transparent}
.pick .who{display:flex;align-items:center;gap:7px;min-width:0}
.pick .ini{font-weight:700;font-size:13px;padding:2px 6px;border-radius:5px;border:1px solid var(--ring)}
.pick .full{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .right{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.pick .load{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pick .why{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.pick .why.h{background:var(--clash-bg);color:var(--clash-fg)}
.pick .why.s{background:var(--amber-bg);color:var(--amber-fg)}
.pick .why.g{background:var(--ok-bg);color:var(--ok-fg)}
.pgroup{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:11px 0 5px;padding-top:9px;border-top:1px solid var(--rule)}
.pgroup:first-child{margin-top:0;padding-top:0;border-top:none}

/* forms */
.f-row{display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
label.fl{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);font-size:13px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-mid);outline-offset:-1px;border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chk input{width:auto}
.rowcard{border:1px solid var(--rule);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--surface)}
.rowcard.off{opacity:.55}
.grid5{display:grid;grid-template-columns:64px 1fr 62px 88px 34px;gap:8px;align-items:end}
.daychks{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.daychk{font-size:11px;border:1px solid var(--rule);border-radius:6px;padding:2px 6px;color:var(--ink-3)}
.daychk.on{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-fg);font-weight:600}
/* per-doctor request calendars */
.doccols{display:grid;grid-template-columns:minmax(0,1fr) 214px;gap:15px;align-items:start}
.reqblock h5{
  display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:0 0 5px;
}
.reqblock h5 .n{margin-left:auto;font-size:10.5px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.reqblock h5 .n.has{color:var(--amber-fg);font-weight:700}
.reqblock h5 .clr{color:var(--ink-3);font-size:13px;line-height:1;padding:0 2px}
.reqblock h5 .clr:hover{color:var(--crit)}
@media (max-width:760px){ .doccols{grid-template-columns:minmax(0,1fr)} }
.reqbar{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.reqbar .mn{display:flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.reqbar .mn button{padding:4px 10px;color:var(--ink-2);font-size:14px;line-height:1}
.reqbar .mn button:hover{background:var(--surface-2)}
.reqbar .mn .lb{padding:4px 11px;font-weight:600;font-size:12.5px;min-width:132px;text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:10px}
.doccard{border:1px solid var(--rule);border-radius:10px;padding:8px 9px 9px;background:var(--surface)}
.doccard h4{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin:0 0 7px}
.doccard .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.doccard .cnt.has{color:var(--amber-fg);font-weight:600}
.doccard .clr{color:var(--ink-3);font-size:13px;line-height:1;padding:0 2px}
.doccard .clr:hover{color:var(--crit)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .mh{font-size:9px;color:var(--ink-3);text-align:center;font-weight:700;letter-spacing:.02em;padding-bottom:2px}
.mini button{
  font-size:10.5px;height:23px;border-radius:5px;border:1px solid transparent;
  color:var(--ink-2);font-variant-numeric:tabular-nums;position:relative;padding:0;
}
.mini button:hover{background:var(--surface-2);border-color:var(--line)}
.mini button.blank{visibility:hidden;pointer-events:none}
.mini button.we{color:var(--brand-deep)}
.mini button.off{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-fg);font-weight:700}
.mini button.sched::after{
  content:"";position:absolute;right:2px;top:2px;width:4px;height:4px;border-radius:50%;background:var(--accent-mid);
}
.mini button.off.sched{background:var(--clash-bg);border-color:var(--clash-bd);color:var(--clash-fg)}
.mini button.off.sched::after{background:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:15px;height:15px;border-radius:4px;border:1px solid var(--line);display:inline-block;position:relative}
.legend i.off{background:var(--amber-bg);border-color:var(--amber-bd)}
.legend i.cf{background:var(--clash-bg);border-color:var(--clash-bd)}
.legend i.sc::after{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%;background:var(--accent-mid)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.hint code{background:var(--surface-2);padding:1px 4px;border-radius:4px;font-size:11px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .wrap{padding:10px;gap:12px}
  .side{order:-1}
  .panel-h{cursor:pointer;user-select:none}
  .panel-h .chev{display:inline-block;color:var(--ink-3);font-size:11px;transition:transform .15s}
  .panel.folded .panel-h .chev{transform:rotate(-90deg)}
  .panel.folded>*:not(.panel-h){display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .cal{grid-template-columns:minmax(0,1fr);border-left:none}
  .dow{display:none}
  .day{min-height:0;border-right:none;border-radius:0}
  .day.out{display:none}
  .day-dow{display:inline}
  .slot .t{width:66px}
  .brand .sub{display:none}
  .brand h1{font-size:14px}
  .brand .mark{font-size:12px;padding:3px 6px}
  .topbar{padding:7px 10px;gap:6px;padding-top:calc(7px + env(safe-area-inset-top))}
  .topbar .btn{padding:4px 9px;font-size:12px}
  .monthnav button{padding:4px 9px}
  .monthnav .mlabel{min-width:104px;padding:4px 8px;font-size:12.5px}
  .modal-b{max-height:70vh}
  .grid5{grid-template-columns:78px minmax(0,1fr) auto;gap:7px 8px}
  .grid5>*:nth-child(1){grid-area:1/1}
  .grid5>*:nth-child(2){grid-area:1/2/auto/span 2}
  .grid5>*:nth-child(3){grid-area:2/1}
  .grid5>*:nth-child(4){grid-area:2/2}
  .grid5>*:nth-child(5){grid-area:2/3}
  .grid5 input{min-width:0}
}

@media print{
  /* always print light — a dark board would flood the page with ink */
  :root, :root[data-theme="dark"]{
    color-scheme: light;
    --paper:#fff; --surface:#fff; --surface-2:#f6eeeb;
    --ink:#000; --ink-2:#333; --ink-3:#666;
    --rule:#bbb; --line:#999; --hatch:#f2f2f2;
    --amber-bg:#fdf2d9; --amber-bd:#e0bd68; --amber-fg:#8a5d05; --warn-fg:#96660a;
    --clash-bg:#f8e3e5; --clash-bd:#c98d95; --clash-fg:#6d0614;
    --ok-bg:#e4f5e4; --ok-fg:#0a6b0a;
    --brand:#eb2429; --brand-soft:#fdeceb; --brand-deep:#b81f24;
    --accent:#3a86c0; --accent-deep:#24506e; --crit:#6d0614;
  }
  :root[data-theme="dark"] .chip[style*="--tint"],
  :root[data-theme="dark"] .dot[style*="--tint"]{background:var(--tint)!important}
  .topbar,.side,.armbar,.kpis .tile .meter,.noprint{display:none!important}
  .offadd{display:none!important}
  body{background:#fff}
  .wrap{grid-template-columns:1fr;padding:0;gap:8px}
  .panel{border:none}
  .day{min-height:120px}
  .cal{border-left:1px solid #999;border-top:1px solid #999}
  .day,.dow{border-color:#999}
  .chip{box-shadow:none!important}
}

<body>

<div class="veil" id="veil"><div id="modalHost"></div></div>

<script>
"use strict";

/* ============================================================
   1. MODEL
   ============================================================ */

const SLOTS = {
  ins:  {label:"6a–6p ins",   start:6,  len:12, kind:"day"},
  outs: {label:"6a–6p outs",  start:6,  len:12, kind:"day"},
  d8:   {label:"8a–8p",       start:8,  len:12, kind:"day"},
  d10:  {label:"10a–10p",     start:10, len:12, kind:"day"},
  d12:  {label:"12p–12a",     start:12, len:12, kind:"day"},
  d14:  {label:"2p–2a",       start:14, len:12, kind:"late"},
  spk3: {label:"4p–10p SPK3", start:16, len:6,  kind:"day"},
  d16:  {label:"4p–2a",       start:16, len:10, kind:"late"},
  noc:  {label:"6p–6a",       start:18, len:12, kind:"night", overnight:true},
};
// Weekday shape, derived from the Nov 2025 – Nov 2026 master schedule.
const TEMPLATE = {
  0:["ins","outs","d10","d12","d16","noc"],  // Sunday  — 6
  1:["ins","outs","d10","d14","noc"],        // Monday  — 5
  2:["ins","d8","d14","noc"],                // Tuesday — 4
  3:["ins","d8","d14","noc"],                // Wednesday
  4:["ins","d8","d14","noc"],                // Thursday
  5:["ins","outs","d10","d12","d16","noc"],  // Friday  — 6
  6:["ins","outs","d10","d12","d16","noc"],  // Saturday— 6
};
const SLOT_ORDER = ["ins","outs","d8","d10","d12","d14","spk3","d16","noc"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Default shift preferences, ordered most-wanted first. Seeded from what each
// doctor actually worked across Nov 2025 – Nov 2026, so the ranking starts from
// real behaviour rather than blank. Soft weighting only — never a rule.
const SEED_PREFS = {
  MG:["ins","d12","outs","d14","d8","d10","d16","spk3","noc"],
  SR:["ins","outs","d10","d8","d12","d14","spk3","d16","noc"],
  CB:["noc","d14","d12","d16","d10","d8","ins","outs","spk3"],
  RL:["noc","d14","d16","d12","d10","ins","outs","d8","spk3"],
  KF:["d14","d16","noc","ins","d10","d12","d8","outs","spk3"],
  CL:["d14","noc","d12","d10","ins","d8","d16","outs","spk3"],
  CD:["outs","ins","d8","d10","spk3","d14","d12","d16","noc"],
  MN:["ins","d8","outs","d10","d14","d12","spk3","d16","noc"],
  MFW:["ins","outs","d8","d10","d12","d14","spk3","d16","noc"],
  SD:["ins","d10","d14","d16","d8","noc","d12","outs","spk3"],
  HK:["noc","d14","d16","d10","d12","ins","d8","outs","spk3"],
  MP:["d14","noc","d16","d12","d10","d8","ins","outs","spk3"],
  CH:["ins","outs","d8","d12","d10","d14","spk3","d16","noc"],
  DM:["ins","d14","outs","d10","d8","d16","d12","noc","spk3"],
  TL:["d10","ins","d8","outs","d12","d14","spk3","d16","noc"],
};

// Doctor identity tints. Two selected sets, hue-matched by index, so a doctor
// keeps the same hue in both modes. Initials always carry identity — colour only
// reinforces it, which is why 16 slots is acceptable here.
const TINTS = [
  "#fbdfe0","#fde3d2","#d9eee2","#fcf0cf","#f7dcea","#dceccf","#e2ddf3","#f9d6d6",
  "#d9e8ee","#f2e2d0","#e8e6cb","#eeddef","#d3e9f2","#f6ded1","#e0e4ec","#ece5d8"
];
const TINTS_DARK = [
  "#5e2b30","#6a3a1f","#14463a","#5a4413","#5c2544","#274a1f","#35306b","#6a2626",
  "#1f4257","#56412a","#464a1d","#4d2a55","#144a54","#63382c","#333e52","#4c4430"
];
function darkTint(hex){
  const i = TINTS.indexOf(hex);
  return i>=0 ? TINTS_DARK[i] : `color-mix(in srgb, ${hex} 34%, #1c1413)`;
}
// Paint an element with a doctor's colour in a way that works in both modes.
function tintEl(node, hex){
  node.style.setProperty("--tint", hex);
  node.style.setProperty("--tint-dark", darkTint(hex));
}

// Seeded from the Nov 2026 preferred-shifts table in the master schedule.
// nightOK mirrors the "# OVN SHIFTS" column: doctors showing 0 overnights in
// every month are marked day-only.
function seedRoster(){
  const d = (initials,name,target,nightOK,restrictions,notes)=>
    ({id:initials,initials,name:name||"",target,nightOK,restrictions:restrictions||[],notes:notes||"",
      active:true, prefs:(SEED_PREFS[initials]||SLOT_ORDER).slice()});
  const r = [
    d("MG","",10,false),
    d("SR","",10,false),
    d("CB","",12,true),
    d("RL","",12,true,[],"Carries the bulk of overnights"),
    d("KF","",12,true,[{days:[4],slots:"all"},{days:[3],slots:"late"}],"No Thursdays, no late Wednesday"),
    d("CL","",12,true,[{days:[4],slots:"all"},{days:[3],slots:"late"}],"No Thursdays, no late Wednesday"),
    d("CD","",10,false),
    d("MN","",12,false),
    d("MFW","",10,false),
    d("SD","",12,true),
    d("HK","",12,true),
    d("MP","",10,true),
    d("CH","",8,false,[],"Master schedule note: “15 or 29 for CH”"),
    d("DM","",10,true),
    d("TL","",10,false,[],"New — confirm target and overnight eligibility"),
  ];
  r.forEach((x,i)=>x.color = TINTS[i % TINTS.length]);
  return r;
}

const DEFAULT_RULES = {
  allowOverride:false,
  maxConsecNights:3,
  maxConsecDays:6,
  weekendDays:[0,6],
  warnOverTarget:true,
  prefStrength:"balanced",   // "balanced" | "strong"
};

let S = load();

function blankState(){
  return {v:2, roster:seedRoster(), pto:{}, schedule:{}, months:{}, rules:{...DEFAULT_RULES},
          view:{y:new Date().getFullYear(), m:new Date().getMonth()}};
}
function load(){
  try{
    const raw = localStorage.getItem("shiftBoard.v1");
    if(!raw) return blankState();
    const s = JSON.parse(raw);
    s.rules = {...DEFAULT_RULES, ...(s.rules||{})};
    if(!s.roster || !s.roster.length) s.roster = seedRoster();
    s.pto = s.pto||{}; s.schedule = s.schedule||{}; s.months = s.months||{};
    // migrate: earlier versions had no preference list
    s.roster.forEach(d=>{ if(!Array.isArray(d.prefs) || !d.prefs.length)
      d.prefs = (SEED_PREFS[d.initials]||SLOT_ORDER).slice(); });
    s.view = s.view||{y:new Date().getFullYear(), m:new Date().getMonth()};
    return s;
  }catch(e){ return blankState(); }
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ localStorage.setItem("shiftBoard.v1", JSON.stringify(S)); }catch(e){} },140);
}

/* ============================================================
   2. DATE + LOOKUP HELPERS
   ============================================================ */

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d);};
const dowOf=s=>fromIso(s).getDay();
const fmtShort=s=>{const d=fromIso(s);return `${DOW3[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;};

const monthKey = (y,m)=> `${y}-${pad(m+1)}`;
// A month may override the standard weekday shape (November's extra 12p-12a, say).
function templateFor(y,m){
  const o = S.months[monthKey(y,m)];
  return (o && o.tpl) ? o.tpl : TEMPLATE;
}
function slotsFor(dateStr){
  const d = fromIso(dateStr);
  const tpl = templateFor(d.getFullYear(), d.getMonth());
  const set = new Set(tpl[d.getDay()] || []);
  return SLOT_ORDER.filter(k=>set.has(k));
}
// A working copy of the current month's shape, created on first edit.
function ensureMonthTpl(y,m){
  const k = monthKey(y,m);
  if(!S.months[k]) S.months[k] = {};
  if(!S.months[k].tpl){
    S.months[k].tpl = {};
    for(let w=0;w<7;w++) S.months[k].tpl[w] = TEMPLATE[w].slice();
  }
  return S.months[k].tpl;
}
const docById = id => S.roster.find(d=>d.id===id) || null;
const activeRoster = () => S.roster.filter(d=>d.active);

function assign(dateStr, slot, id){
  if(!S.schedule[dateStr]) S.schedule[dateStr] = {};
  if(id) S.schedule[dateStr][slot] = id;
  else delete S.schedule[dateStr][slot];
  if(!Object.keys(S.schedule[dateStr]).length) delete S.schedule[dateStr];
  save();
}
const at = (dateStr, slot) => (S.schedule[dateStr]||{})[slot] || null;
function shiftsOn(dateStr, id){
  const day = S.schedule[dateStr]||{};
  return Object.keys(day).filter(k=>day[k]===id);
}
function isPTO(id, dateStr){ return !!(S.pto[id]||[]).includes(dateStr); }

function monthDays(y,m){
  const out=[]; const d=new Date(y,m,1);
  while(d.getMonth()===m){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
// Full grid including leading/trailing days so weeks are whole.
function gridDays(y,m){
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  const end=new Date(last); end.setDate(last.getDate()+(6-last.getDay()));
  const out=[]; const d=new Date(start);
  while(d<=end){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* ============================================================
   3. RULE ENGINE
   Hard rules block placement. Soft rules warn.
   ============================================================ */

function consecutiveNightsIfPlaced(id, dateStr){
  let n=1, c=dateStr;
  while(true){ c=addDays(c,-1); if(at(c,"noc")===id) n++; else break; }
  c=dateStr;
  while(true){ c=addDays(c,1); if(at(c,"noc")===id) n++; else break; }
  return n;
}
function consecutiveDaysIfPlaced(id, dateStr){
  const worked = s => shiftsOn(s,id).length>0;
  let n=1, c=dateStr;
  while(true){ c=addDays(c,-1); if(worked(c)) n++; else break; }
  c=dateStr;
  while(true){ c=addDays(c,1); if(worked(c)) n++; else break; }
  return n;
}

// Hard rules. Deliberately free of any month-wide aggregate so the solver can
// call this hundreds of thousands of times without recomputing stats().
function hardCheck(id, dateStr, slot, ignoreSelf){
  const doc = docById(id); const out=[];
  if(!doc) return out;
  const sl = SLOTS[slot];

  if(isPTO(id,dateStr))
    out.push({level:"hard", code:"pto", msg:`${id} requested ${fmtShort(dateStr)} off`});

  if(sl.overnight && !doc.nightOK)
    out.push({level:"hard", code:"night", msg:`${id} does not work overnights`});

  const already = shiftsOn(dateStr,id).filter(k=> ignoreSelf===false ? true : k!==slot);
  if(already.length)
    out.push({level:"hard", code:"double", msg:`${id} already has ${SLOTS[already[0]].label} on ${fmtShort(dateStr)}`});

  // day-after-night, checked in both directions
  if(!sl.overnight && at(addDays(dateStr,-1),"noc")===id)
    out.push({level:"hard", code:"postnight", msg:`${id} worked the overnight into ${fmtShort(dateStr)} morning`});

  if(sl.overnight){
    const nx = addDays(dateStr,1);
    const nextDay = Object.keys(S.schedule[nx]||{}).filter(k=>S.schedule[nx][k]===id && k!=="noc");
    if(nextDay.length)
      out.push({level:"hard", code:"prenight", msg:`${id} is already on ${SLOTS[nextDay[0]].label} the next day`});
  }
  return out;
}
const hardOK = (id,ds,slot)=> hardCheck(id,ds,slot,true).length===0;

// Soft rules that depend only on neighbouring days, not on month totals.
function softCheck(id, dateStr, slot){
  const doc = docById(id); const out=[];
  if(!doc) return out;
  const sl = SLOTS[slot], w = dowOf(dateStr);

  for(const r of (doc.restrictions||[])){
    if(!r.days.includes(w)) continue;
    if(r.slots==="all" || (r.slots==="late" && (sl.kind==="late"||sl.kind==="night"))){
      const what = r.slots==="late" ? `late ${DOW[w]}s` : `${DOW[w]}s`;
      out.push({level:"soft", code:"restrict", msg:`${id} does not take ${what}`});
    }
  }
  if(sl.overnight){
    const n = consecutiveNightsIfPlaced(id,dateStr);
    if(n > S.rules.maxConsecNights)
      out.push({level:"soft", code:"consecnight", msg:`${n} overnights in a row for ${id} (cap ${S.rules.maxConsecNights})`});
  }
  const cd = consecutiveDaysIfPlaced(id,dateStr);
  if(cd > S.rules.maxConsecDays)
    out.push({level:"soft", code:"consecday", msg:`${cd} days worked in a row for ${id} (cap ${S.rules.maxConsecDays})`});
  return out;
}

// Where in a doctor's ranking this shift sits. 1 = top choice, 0 = last.
function prefRank(doc, slot){
  const p = doc.prefs || [];
  const i = p.indexOf(slot);
  if(i < 0) return 0.5;
  return p.length<2 ? 1 : 1 - i/(p.length-1);
}

// Returns [{level:"hard"|"soft", code, msg}] — the full picture, for the UI.
function checkPlacement(id, dateStr, slot, {ignoreSelf=true}={}){
  const doc = docById(id);
  if(!doc) return [];
  const out = [...hardCheck(id,dateStr,slot,ignoreSelf), ...softCheck(id,dateStr,slot)];
  if(S.rules.warnOverTarget){
    const st = stats()[id];
    if(st){
      const cur = at(dateStr,slot)===id ? st.shifts : st.shifts+1;
      if(cur > doc.target)
        out.push({level:"soft", code:"overtarget", msg:`puts ${id} at ${cur} of ${doc.target} preferred`});
    }
  }
  return out;
}

/* ============================================================
   3b. AUTO-FILL
   A local solver, not a language model — it enumerates every open slot and
   scores every legal doctor for it. Hard rules are absolute: a slot is left
   OPEN rather than filled illegally.
   ============================================================ */

const WEIGHTS = {
  need:        12,   // per shift still owed against their preferred total
  overshoot:  -55,   // flat penalty once a doctor is at or past target
  pref:        34,   // full weight of a top-ranked shift type
  wkndEquity:  -7,   // per weekend shift above the roster average
  ovnEquity:   -5,   // per overnight above the average of night-eligible docs
  restrict:   -45,   // blocked weekday
  consecNight:-28,
  consecDay:  -20,
  otherSoft:  -10,
  continuity:  10,   // same slot as yesterday — real schedules run in blocks
  longRun:     -8,   // per day beyond 3 worked in a row
  sameType:    -7,   // per repeat of one slot type past that doctor's allowance,
                     // so nobody spends a whole month on a single shift
};
// How many of one shift type a doctor can take before repetition starts costing.
// Scales with how highly they rank it, so a dedicated nocturnist still gets
// nights while a generalist gets a spread.
function sameTypeAllowance(doc, slot){
  const strong = S.rules.prefStrength==="strong";
  return 2 + Math.round(prefRank(doc,slot)*5) + (SLOTS[slot].overnight ? 3 : 0) + (strong?4:0);
}

function autofill({mode="open", allowOvershoot=true} = {}){
  const y=S.view.y, m=S.view.m;
  const days = monthDays(y,m);
  const roster = activeRoster();
  if(!roster.length) return {filled:0, open:0, cleared:0, unfilled:[], before:0};

  let cleared = 0;
  if(mode==="rebuild"){
    for(const ds of days){
      for(const slot of slotsFor(ds)) if(at(ds,slot)){ assign(ds,slot,null); cleared++; }
    }
  }

  // live counters, so the scorer never has to recompute month aggregates
  const cnt = {};
  roster.forEach(d=> cnt[d.id]={shifts:0,wknd:0,ovn:0,byType:{}});
  for(const ds of days){
    const isW = S.rules.weekendDays.includes(dowOf(ds));
    for(const slot of slotsFor(ds)){
      const id = at(ds,slot);
      if(!id || !cnt[id]) continue;
      cnt[id].shifts++; if(isW) cnt[id].wknd++; if(SLOTS[slot].overnight) cnt[id].ovn++;
      cnt[id].byType[slot] = (cnt[id].byType[slot]||0)+1;
    }
  }
  const before = Object.values(cnt).reduce((a,b)=>a+b.shifts,0);

  // every empty slot, hardest to staff first: overnights, then weekends, then
  // whichever slot type has the fewest eligible doctors overall
  const eligibleCount = {};
  for(const k of SLOT_ORDER)
    eligibleCount[k] = roster.filter(d=> !SLOTS[k].overnight || d.nightOK).length;

  const todo = [];
  for(const ds of days){
    const isW = S.rules.weekendDays.includes(dowOf(ds));
    for(const slot of slotsFor(ds)){
      if(at(ds,slot)) continue;
      todo.push({ds, slot, isW,
        rank: (SLOTS[slot].overnight?0:1)*100 + eligibleCount[slot] + (isW?0:5) });
    }
  }
  todo.sort((a,b)=> a.rank-b.rank || a.ds.localeCompare(b.ds) || SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot));

  // "strong" leans hard on each doctor's ranking, which reproduces specialists
  // (a nocturnist taking most of the nights). "balanced" spreads the load.
  const K = S.rules.prefStrength==="strong" ? {pref:2.9, equity:0.4} : {pref:1, equity:1};
  const nightDocs = roster.filter(d=>d.nightOK).length || 1;
  const totalSlots = days.reduce((n,ds)=>n+slotsFor(ds).length, 0);
  const wkndSlots  = days.filter(ds=>S.rules.weekendDays.includes(dowOf(ds)))
                         .reduce((n,ds)=>n+slotsFor(ds).length,0);
  const ovnSlots   = days.length;
  const avgWknd = wkndSlots/roster.length;
  const avgOvn  = ovnSlots/nightDocs;

  function score(doc, ds, slot, isW){
    if(!hardOK(doc.id, ds, slot)) return null;
    const c = cnt[doc.id];
    let sc = 0;
    const need = doc.target - c.shifts;
    sc += need * WEIGHTS.need;
    if(need <= 0){
      if(!allowOvershoot) return null;
      sc += WEIGHTS.overshoot;
    }
    sc += prefRank(doc, slot) * WEIGHTS.pref * K.pref;
    if(isW) sc += (c.wknd - avgWknd) * WEIGHTS.wkndEquity * K.equity;
    if(SLOTS[slot].overnight) sc += (c.ovn - avgOvn) * WEIGHTS.ovnEquity * K.equity;
    for(const v of softCheck(doc.id, ds, slot)){
      sc += v.code==="restrict"    ? WEIGHTS.restrict
          : v.code==="consecnight" ? WEIGHTS.consecNight
          : v.code==="consecday"   ? WEIGHTS.consecDay
          : WEIGHTS.otherSoft;
    }
    if(at(addDays(ds,-1), slot) === doc.id) sc += WEIGHTS.continuity;
    const run = consecutiveDaysIfPlaced(doc.id, ds);
    if(run > 3) sc += (run-3) * WEIGHTS.longRun;
    const same = c.byType[slot] || 0;
    const allow = sameTypeAllowance(doc, slot);
    if(same > allow) sc += (same-allow) * WEIGHTS.sameType;
    return sc;
  }

  const place = (ds,slot,id,isW)=>{
    assign(ds,slot,id);
    const c=cnt[id];
    c.shifts++; if(isW) c.wknd++; if(SLOTS[slot].overnight) c.ovn++;
    c.byType[slot]=(c.byType[slot]||0)+1;
  };
  const unplace = (ds,slot,id,isW)=>{
    assign(ds,slot,null);
    const c=cnt[id];
    c.shifts--; if(isW) c.wknd--; if(SLOTS[slot].overnight) c.ovn--;
    c.byType[slot]=(c.byType[slot]||1)-1;
  };

  const unfilled = [];
  for(const t of todo){
    let best=null, bestScore=-Infinity;
    for(const doc of roster){
      const sc = score(doc, t.ds, t.slot, t.isW);
      if(sc===null) continue;
      if(sc > bestScore){ bestScore=sc; best=doc; }
    }
    if(best) place(t.ds, t.slot, best.id, t.isW);
    else unfilled.push({ds:t.ds, slot:t.slot});
  }

  // Balancing pass — hand shifts from doctors past their target to doctors
  // short of it, wherever that is legal and does not worsen preference much.
  for(let pass=0; pass<3; pass++){
    let moved = 0;
    const short = roster.filter(d=> cnt[d.id].shifts < d.target)
                        .sort((a,b)=> (cnt[a.id].shifts-a.target) - (cnt[b.id].shifts-b.target));
    for(const doc of short){
      if(cnt[doc.id].shifts >= doc.target) continue;
      let take=null, takeScore=-Infinity;
      for(const ds of days){
        const isW = S.rules.weekendDays.includes(dowOf(ds));
        for(const slot of slotsFor(ds)){
          const holder = at(ds,slot);
          if(!holder || holder===doc.id) continue;
          const h = docById(holder);
          if(!h || !cnt[holder] || cnt[holder].shifts <= h.target) continue;
          unplace(ds,slot,holder,isW);
          const sc = score(doc, ds, slot, isW);
          if(sc!==null && sc>takeScore){ takeScore=sc; take={ds,slot,holder,isW}; }
          place(ds,slot,holder,isW);
        }
      }
      if(take){
        unplace(take.ds,take.slot,take.holder,take.isW);
        place(take.ds,take.slot,doc.id,take.isW);
        moved++;
      }
    }
    if(!moved) break;
  }

  // Last look at anything still open, now that the board has shifted around.
  const stillOpen = [];
  for(const u of unfilled){
    if(at(u.ds,u.slot)) continue;
    const isW = S.rules.weekendDays.includes(dowOf(u.ds));
    let best=null, bestScore=-Infinity;
    for(const doc of roster){
      const sc = score(doc, u.ds, u.slot, isW);
      if(sc!==null && sc>bestScore){ bestScore=sc; best=doc; }
    }
    if(best) place(u.ds,u.slot,best.id,isW);
    else stillOpen.push(u);
  }

  const after = Object.values(cnt).reduce((a,b)=>a+b.shifts,0);
  save();
  return {
    placed: after-before, cleared, before, totalSlots,
    filled: after, open: totalSlots-after, unfilled: stillOpen,
    onTarget: roster.filter(d=>cnt[d.id].shifts===d.target).length,
    rosterN: roster.length,
  };
}

   4. AGGREGATES
   ============================================================ */

let _statCache=null, _statKey="";
function stats(){
  const key = S.view.y+"-"+S.view.m+"|"+JSON.stringify(S.schedule).length+"|"+_dirty;
  if(_statCache && _statKey===key) return _statCache;
  const days = monthDays(S.view.y,S.view.m);
  const out={};
  activeRoster().forEach(d=>out[d.id]={shifts:0,wknd:0,ovn:0,pto:0,target:d.target});
  for(const ds of days){
    const day = S.schedule[ds]||{};
    const isWknd = S.rules.weekendDays.includes(dowOf(ds));
    for(const k in day){
      const id=day[k]; if(!out[id]) continue;
      out[id].shifts++;
      if(isWknd) out[id].wknd++;
      if(SLOTS[k] && SLOTS[k].overnight) out[id].ovn++;
    }
    for(const id in out) if(isPTO(id,ds)) out[id].pto++;
  }
  _statCache=out; _statKey=key;
  return out;
}
let _dirty=0;
const touch = ()=>{ _dirty++; };

function monthAudit(){
  const days = monthDays(S.view.y,S.view.m);
  let total=0, filled=0, open=0;
  const issues=[]; const cellFlags={};
  for(const ds of days){
    for(const slot of slotsFor(ds)){
      total++;
      const id = at(ds,slot);
      if(!id){ open++; continue; }
      filled++;
      const v = checkPlacement(id, ds, slot);
      if(v.length){
        const worst = v.some(x=>x.level==="hard") ? "hard":"soft";
        cellFlags[ds+"|"+slot] = {level:worst, list:v};
        v.forEach(x=>issues.push({...x, date:ds, slot, id}));
      }
    }
  }
  issues.sort((a,b)=> (a.level===b.level? a.date.localeCompare(b.date) : (a.level==="hard"?-1:1)));
  return {total, filled, open, issues, cellFlags,
          hard:issues.filter(i=>i.level==="hard").length,
          soft:issues.filter(i=>i.level==="soft").length};
}

let armed = null;
const $  = s => document.querySelector(s);
const el = (t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};

function render(){
  touch();
  const audit = monthAudit();
  renderKpis(audit);
  renderCal(audit);
  renderRoster();
  renderIssues(audit);
  $("#mLabel").textContent = new Date(S.view.y,S.view.m,1)
      .toLocaleDateString(undefined,{month:"long",year:"numeric"});
  $("#calTitle").textContent = new Date(S.view.y,S.view.m,1)
      .toLocaleDateString(undefined,{month:"long",year:"numeric"});
  $("#calHint").textContent = `${audit.filled} of ${audit.total} slots filled`;
  save();
}

function renderKpis(a){
  const st = stats();
  const targetSum = activeRoster().reduce((s,d)=>s+ (+d.target||0), 0);
  const pct = a.total? Math.round(a.filled/a.total*100):0;
  const cap = targetSum - a.total;

  const host = $("#kpis"); host.innerHTML="";
  host.appendChild(tile({
    lab:"Slots filled", val:a.filled, of:` / ${a.total}`,
    note:`${pct}% of the month covered`,
    meter:{pct, cls: a.filled>=a.total?"done":""}
  }));
  host.appendChild(tile({
    lab:"OPEN shifts", val:a.open, cls: a.open? "warnt":"clear",
    note: a.open ? "unfilled — needs coverage" : "fully covered"
  }));
  host.appendChild(tile({
    lab:"Rule violations", val:a.hard, cls: a.hard? "alert":"clear",
    note: a.hard ? "hard rules broken" : "no hard rules broken"
  }));
  host.appendChild(tile({
    lab:"Capacity vs demand", val:(cap>=0?"+":"")+cap,
    cls: cap<0 ? "alert":"clear",
    note: cap>=0
      ? `${targetSum} preferred shifts for ${a.total} slots`
      : `short ${Math.abs(cap)} shifts of preferred capacity`
  }));
}
function tile({lab,val,of,note,cls,meter}){
  const t = el("div","tile"+(cls?" "+cls:""));
  t.appendChild(el("div","lab",lab));
  const v = el("div","val"); v.textContent = val;
  if(of){ const o=el("span","of",of); v.appendChild(o); }
  t.appendChild(v);
  if(note) t.appendChild(el("div","note",note));
  if(meter){
    const m = el("div","meter"+(meter.cls?" "+meter.cls:""));
    const i = el("i"); i.style.width = Math.min(100,meter.pct)+"%";
    m.appendChild(i); t.appendChild(m);
  }
  return t;
}

function renderCal(audit){
  const cal = $("#cal"); cal.innerHTML="";
  DOW.forEach((d,i)=>{
    const h = el("div","dow"+([0,6].includes(i)?" we":""), d);
    cal.appendChild(h);
  });
  const todayIso = iso(new Date());
  for(const ds of gridDays(S.view.y,S.view.m)){
    const d = fromIso(ds);
    const inMonth = d.getMonth()===S.view.m;
    const w = d.getDay();
    const cell = el("div","day"+(inMonth?"":" out")+([0,6].includes(w)?" we":"")+(ds===todayIso?" today":""));

    const hd = el("div","day-h");
    hd.appendChild(el("span","day-n", String(d.getDate())));
    hd.appendChild(el("span","day-dow", DOW3[w]));
    const slots = slotsFor(ds);
    if(inMonth){
      const filled = slots.filter(s=>at(ds,s)).length;
      hd.appendChild(el("span","day-cnt"+(filled<slots.length?" short":""), `${filled}/${slots.length}`));
    }
    cell.appendChild(hd);

    if(inMonth){
      // OFF strip — each name is a toggle, and "+" opens the whole day
      const o = el("div","off-line");
      const offList = activeRoster().filter(x=>isPTO(x.id,ds));
      if(offList.length) o.appendChild(el("b","","OFF"));
      for(const doc of offList){
        const clash = shiftsOn(ds, doc.id).length>0;
        const c = el("button","offchip"+(clash?" clash":""), doc.initials);
        c.title = clash
          ? `${doc.initials} requested this day off but is still on ${SLOTS[shiftsOn(ds,doc.id)[0]].label} — click to cancel the request`
          : `${doc.initials} requested ${fmtShort(ds)} off — click to make them available again`;
        c.addEventListener("click", ()=>{ setReq(doc.id, ds, false); save(); render(); });
        o.appendChild(c);
      }
      const plus = el("button","offadd", offList.length ? "+" : "+ mark off");
      plus.title = `Set who is off on ${fmtShort(ds)}`;
      plus.addEventListener("click", ()=> openOffDay(ds));
      o.appendChild(plus);
      cell.appendChild(o);
      for(const slot of slots){
        cell.appendChild(slotRow(ds, slot, audit));
      }
    }
    cal.appendChild(cell);
  }
}

function slotRow(ds, slot, audit){
  const row = el("div","slot"+(SLOTS[slot].overnight?" noc":""));
  row.appendChild(el("span","t", SLOTS[slot].label));
  const id = at(ds,slot);
  const flag = audit.cellFlags[ds+"|"+slot];
  const b = el("button","chip"+(id?"":" open")+(flag?" "+flag.level:""));
  if(id){
    const doc = docById(id);
    if(doc) tintEl(b, doc.color); else b.style.background="var(--surface-2)";
    b.appendChild(el("span","nm", doc ? doc.initials : id));
    if(flag){
      const f = el("span","flag "+(flag.level==="hard"?"h":"s"), flag.level==="hard"?"●":"▲");
      f.title = flag.list.map(x=>x.msg).join("\n");
      b.appendChild(f);
    }
  } else {
    b.appendChild(el("span","nm","OPEN"));
    // while placing a doctor, grey out the slots they cannot legally take
    if(armed){
      const hard = checkPlacement(armed, ds, slot).filter(x=>x.level==="hard");
      if(hard.length && !S.rules.allowOverride){
        b.classList.add("noarm");
        b.title = hard[0].msg;
      }
    }
  }
  b.addEventListener("click", ()=>{
    if(armed && !id){ placeArmed(ds,slot); return; }
    openPicker(ds,slot);
  });
  row.appendChild(b);
  return row;
}

function renderRoster(){
  const st = stats();
  const t = $("#rtable");
  t.innerHTML = `<thead><tr>
      <th>Doctor</th><th>Shifts</th><th title="Saturday and Sunday">Wknd</th>
      <th title="6p–6a">Ovn</th><th title="Days requested off this month">Req</th>
    </tr></thead>`;
  const tb = el("tbody");
  for(const d of activeRoster()){
    const s = st[d.id] || {shifts:0,wknd:0,ovn:0,pto:0};
    const tr = el("tr"); if(armed===d.id) tr.className="picked";
    const td1 = el("td");
    const nm = el("div","rname");
    const dot = el("span","dot"); tintEl(dot, d.color); nm.appendChild(dot);
    nm.appendChild(el("span","ini", d.initials));
    if(d.nightOK) nm.appendChild(el("span","noc-b","N"));
    td1.appendChild(nm); tr.appendChild(td1);

    const td2 = el("td");
    const cm = el("div","cell-meter");
    const pct = d.target? Math.min(100, Math.round(s.shifts/d.target*100)) : 0;
    const overCls = s.shifts>d.target ? " over" : (s.shifts===d.target ? " done":"");
    const m = el("span","m"+overCls); const i=el("i"); i.style.width=pct+"%"; m.appendChild(i);
    const num = el("span","num "+(s.shifts>d.target?"over":s.shifts===d.target?"exact":"under"),
                   `${s.shifts}/${d.target}`);
    cm.appendChild(m); cm.appendChild(num); td2.appendChild(cm); tr.appendChild(td2);

    tr.appendChild(el("td","", String(s.wknd)));
    const tdo = el("td", d.nightOK?"":"mut", d.nightOK? String(s.ovn) : "—");
    tr.appendChild(tdo);
    tr.appendChild(el("td","mut", String(s.pto)));

    tr.addEventListener("click", ()=> toggleArm(d.id));
    tb.appendChild(tr);
  }
  t.appendChild(tb);
}

function renderIssues(a){
  const host = $("#issues"); host.innerHTML="";
  $("#issueCount").textContent = a.issues.length
      ? `${a.hard} hard · ${a.soft} soft` : "";
  if(!a.issues.length){
    const e = el("div","empty"+(a.open?"":" ok"),
      a.open ? "No violations. "+a.open+" slot"+(a.open>1?"s":"")+" still OPEN."
             : "Every slot covered, no rules broken. All cats herded.");
    host.appendChild(e); return;
  }
  for(const i of a.issues.slice(0,140)){
    const b = el("button","issue "+(i.level==="hard"?"h":"s"));
    b.appendChild(el("span","bar"));
    const wrap = el("div");
    wrap.appendChild(el("div","d", `${fmtShort(i.date)} · ${SLOTS[i.slot].label}`));
    const m = el("div","m"); m.innerHTML = i.msg.replace(/^(\w+)/, "<b>$1</b>");
    wrap.appendChild(m);
    b.appendChild(wrap);
    b.addEventListener("click", ()=> openPicker(i.date, i.slot));
    host.appendChild(b);
  }
}

function toggleArm(id){
  armed = (armed===id) ? null : id;
  document.body.classList.toggle("armed", !!armed);
  if(armed) $("#armName").textContent = armed;
  render();
}
function placeArmed(ds,slot){
  const v = checkPlacement(armed, ds, slot);
  const hard = v.filter(x=>x.level==="hard");
  if(hard.length && !S.rules.allowOverride){
    flashBlock(hard[0].msg); return;
  }
  assign(ds,slot,armed);
  render();
}
let flashT=null;
function flashBlock(msg){
  let n = $("#flash");
  if(!n){
    n = el("div"); n.id="flash";
    n.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:120;"+
      "background:var(--crit);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;"+
      "box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center";
    document.body.appendChild(n);
  }
  n.textContent = msg; n.style.display="block";
  clearTimeout(flashT); flashT=setTimeout(()=>{n.style.display="none";},2400);
}

function showModal(node){

document.addEventListener("keydown", e=>{

function modalShell(title, sub, wide){

/* ---- assignment picker ---- */
function openPicker(ds, slot){
  const cur = at(ds,slot);
  const {m, body, foot} = modalShell(
    SLOTS[slot].label,
    `${DOW[dowOf(ds)]}, ${fromIso(ds).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}`
  );
  const st = stats();

  const rows = activeRoster().map(d=>{
    const v = checkPlacement(d.id, ds, slot);
    const hard = v.filter(x=>x.level==="hard");
    const soft = v.filter(x=>x.level==="soft");
    const s = st[d.id]||{shifts:0};
    return {d, v, hard, soft, need: d.target - s.shifts, cur:s.shifts};
  });
  rows.sort((a,b)=>{
    const rank = r => r.hard.length ? 2 : (r.soft.length ? 1 : 0);
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    if(b.need!==a.need) return b.need-a.need;
    const pa = prefRank(a.d, slot), pb = prefRank(b.d, slot);
    if(pb!==pa) return pb-pa;
    return a.d.initials.localeCompare(b.d.initials);
  });

  const groups = [
    ["Currently assigned", r=>r.d.id===cur],
    ["Available", r=>r.d.id!==cur && !r.hard.length && !r.soft.length],
    ["Available with a caution", r=>r.d.id!==cur && !r.hard.length && r.soft.length],
    ["Blocked", r=>r.d.id!==cur && r.hard.length],
  ];
  for(const [gname, test] of groups){
    const set = rows.filter(test);
    if(!set.length) continue;
    body.appendChild(el("div","pgroup", gname));
    for(const r of set){
      const isCur = r.d.id===cur;
      const blocked = !isCur && r.hard.length && !S.rules.allowOverride;
      const btn = el("button","pick"+(blocked?" blocked":""));
      if(isCur) btn.style.cssText="background:var(--brand-soft);border-color:var(--brand-mid)";
      const who = el("div","who");
      const ini = el("span","ini", r.d.initials); tintEl(ini, r.d.color);
      who.appendChild(ini);
      if(r.d.name) who.appendChild(el("span","full", r.d.name));
      btn.appendChild(who);
      const right = el("div","right");
      const pi = (r.d.prefs||[]).indexOf(slot);
      if(pi>=0 && pi<3 && !r.hard.length)
        right.appendChild(el("span","pref", pi===0 ? "top choice" : `#${pi+1} choice`));
      right.appendChild(el("span","load", `${r.cur}/${r.d.target}`));
      if(r.hard.length) right.appendChild(el("span","why h", r.hard[0].msg));
      else if(r.soft.length) right.appendChild(el("span","why s", r.soft[0].msg));
      else if(isCur) right.appendChild(el("span","why g", "on this shift"));
      else if(r.need>0) right.appendChild(el("span","why g", `needs ${r.need} more`));
      btn.appendChild(right);
      if(isCur){
        btn.addEventListener("click", ()=>{ assign(ds,slot,null); closeModal(); render(); });
      } else if(!blocked){
        btn.addEventListener("click", ()=>{ assign(ds,slot,r.d.id); closeModal(); render(); });
      }
      body.appendChild(btn);
    }
  }

  if(cur){
    const clr = el("button","btn danger","Clear this slot");
    clr.addEventListener("click", ()=>{ assign(ds,slot,null); closeModal(); render(); });
    foot.appendChild(clr);
  }
  foot.appendChild(el("span","spacer"));
  const hintTxt = S.rules.allowOverride
      ? "Override is on — blocked doctors can still be placed."
      : "Blocked doctors break a hard rule. Turn on override in Rules to place anyway.";
  foot.appendChild(el("span","hint", hintTxt));
  showModal(m);
}

/* Ranked shift preferences — soft weighting the solver reads, never a rule.
   Collapsed to a one-line summary until you open it, so the roster stays scannable. */
const prefOpen = {};
function prefBox(d, redraw){
  const wrap = el("div","prefbox");
  if(!Array.isArray(d.prefs) || !d.prefs.length) d.prefs = SLOT_ORDER.slice();
  // keep the list honest if slot types ever change
  d.prefs = d.prefs.filter(k=>SLOTS[k]).concat(SLOT_ORDER.filter(k=>!d.prefs.includes(k)));

  const sum = el("button","prefsum");
  sum.appendChild(document.createTextNode("Prefers "));
  const b = el("b","", d.prefs.slice(0,3).map(k=>SLOTS[k].label).join(", "));
  sum.appendChild(b);
  sum.appendChild(el("span","ed", prefOpen[d.id] ? "close" : "reorder"));
  sum.addEventListener("click", ()=>{ prefOpen[d.id] = !prefOpen[d.id]; redraw(); });
  wrap.appendChild(sum);

  if(prefOpen[d.id]){
    const list = el("div","preflist");
    d.prefs.forEach((k,i)=>{
      const row = el("div","prefrow"+(i<3?" top":""));
      row.appendChild(el("span","r", String(i+1)));
      row.appendChild(el("span","l", SLOTS[k].label));
      if(SLOTS[k].overnight && !d.nightOK)
        row.appendChild(el("span","hint","day-only"));
      const up = el("button","mv","▲"), dn = el("button","mv","▼");
      if(i===0) up.setAttribute("disabled","");
      if(i===d.prefs.length-1) dn.setAttribute("disabled","");
      up.addEventListener("click", ()=>{ swapPref(d,i,i-1); save(); redraw(); });
      dn.addEventListener("click", ()=>{ swapPref(d,i,i+1); save(); redraw(); });
      row.append(up,dn);
      list.appendChild(row);
    });
    wrap.appendChild(list);
    const rs = el("button","btn"); rs.textContent="Reset to their usual mix";
    rs.style.cssText="margin-top:6px;font-size:11.5px;padding:3px 8px";
    rs.title="Back to the ranking derived from what they actually worked";
    rs.addEventListener("click", ()=>{
      d.prefs = (SEED_PREFS[d.initials]||SLOT_ORDER).slice(); save(); redraw();
    });
    wrap.appendChild(rs);
  }
  return wrap;
}
function swapPref(d,i,j){
  if(j<0 || j>=d.prefs.length) return;
  const t=d.prefs[i]; d.prefs[i]=d.prefs[j]; d.prefs[j]=t;
}

function restrictState(d,w){
  const r = (d.restrictions||[]).find(x=>x.days.includes(w));
  if(!r) return 0;
  return r.slots==="late" ? 2 : 1;
}
function cycleRestrict(d,w){
  d.restrictions = d.restrictions||[];
  const st = restrictState(d,w);
  d.restrictions = d.restrictions.filter(x=>!x.days.includes(w) || (x.days=x.days.filter(y=>y!==w)).length);
  if(st===0) d.restrictions.push({days:[w], slots:"all"});
  else if(st===1) d.restrictions.push({days:[w], slots:"late"});
}

    list.innerHTML="";
    const st = stats();

      d, off:isPTO(d.id,ds), mine:shiftsOn(ds,d.id), load:(st[d.id]||{shifts:0}).shifts
    }));
    rows.sort((a,b)=> (b.off-a.off) || a.d.initials.localeCompare(b.d.initials));

      else if(r.off)

  showModal(m);

/* ---- requests off: a mini calendar that belongs to one doctor ---- */
let lastReqClick = {};   // doctorId -> last date clicked, for shift-click ranges

function setReq(id, ds, on){
  S.pto[id] = S.pto[id] || [];
  const i = S.pto[id].indexOf(ds);
  if(on && i<0) S.pto[id].push(ds);
  if(!on && i>=0) S.pto[id].splice(i,1);
  S.pto[id].sort();
}

// One doctor's month. Click a day to block it; shift-click to run a range.
function miniCal(d, redraw){
  const days = monthDays(S.view.y, S.view.m);
  const off = new Set((S.pto[d.id]||[]).filter(x=>days.includes(x)));

  const wrap = el("div","reqblock");
  const h = el("h5");
  h.appendChild(document.createTextNode("Requested off"));
  const n = el("span","n"+(off.size?" has":""), off.size ? `${off.size} day${off.size>1?"s":""}` : "none");
  h.appendChild(n);
  if(off.size){
    const clr = el("button","clr","×");
    clr.title = `Clear ${d.initials}'s requests for this month`;
    clr.addEventListener("click", ()=>{
      S.pto[d.id] = (S.pto[d.id]||[]).filter(x=>!days.includes(x));
      save(); redraw(); render();
    });
    h.appendChild(clr);
  }
  wrap.appendChild(h);

  const mini = el("div","mini");
  ["S","M","T","W","T","F","S"].forEach(x=> mini.appendChild(el("div","mh", x)));
  for(let i=0;i<fromIso(days[0]).getDay();i++){
    const b=el("button","blank"); b.tabIndex=-1; mini.appendChild(b);
  }
  for(const ds of days){
    const w = dowOf(ds);
    const isOff = off.has(ds);
    const mine = shiftsOn(ds, d.id);
    const b = el("button",
      [[0,6].includes(w)?"we":"", isOff?"off":"", mine.length?"sched":""].filter(Boolean).join(" "),
      String(fromIso(ds).getDate()));
    b.title = fmtShort(ds)
      + (isOff ? " — requested off" : "")
      + (mine.length ? ` — scheduled ${SLOTS[mine[0]].label}` : "");
    b.addEventListener("click", ev=>{
      const anchor = lastReqClick[d.id];
      if(ev.shiftKey && anchor){
        const [a,z] = anchor<=ds ? [anchor,ds] : [ds,anchor];
        const turnOn = !isOff;
        let c=a, guard=0;
        while(c<=z && guard++<400){ setReq(d.id,c,turnOn); c=addDays(c,1); }
      } else {
        setReq(d.id, ds, !isOff);
      }
      lastReqClick[d.id] = ds;
      save(); redraw(); render();
    });
    mini.appendChild(b);
  }
  wrap.appendChild(mini);
  return wrap;
}

/* ---- per-month coverage shape ---- */
function openMonthSetup(){
  const label = new Date(S.view.y,S.view.m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const {m, body, foot} = modalShell(label + " coverage",
    "Which shifts run on which weekday, for this month only", true);

  const lede = el("div","hint"); lede.style.marginBottom="10px";
  lede.textContent = "Every other month keeps the standard shape. Turning a shift off will unassign anyone already placed on it.";
  body.appendChild(lede);

  const host = el("div"); body.appendChild(host);
  const summary = el("div","hint"); summary.style.marginTop="10px"; body.appendChild(summary);

  function draw(){
    const custom = !!(S.months[monthKey(S.view.y,S.view.m)]||{}).tpl;
    const tpl = custom ? S.months[monthKey(S.view.y,S.view.m)].tpl : TEMPLATE;
    host.innerHTML="";
    const g = el("div","cov");
    g.appendChild(el("div","cov-h",""));
    DOW3.forEach((d,w)=> g.appendChild(el("div","cov-h"+([0,6].includes(w)?" we":""), d)));
    for(const k of SLOT_ORDER){
      g.appendChild(el("div","cov-r"+(SLOTS[k].overnight?" noc":""), SLOTS[k].label));
      for(let w=0;w<7;w++){
        const on = (tpl[w]||[]).includes(k);
        const b = el("button","cov-c"+(on?" on":""), on?"●":"");
        b.title = `${SLOTS[k].label} on ${DOW[w]}s`;
        b.addEventListener("click", ()=> toggle(k,w));
        g.appendChild(b);
      }
    }
    // per-weekday totals
    g.appendChild(el("div","cov-r tot","doctors"));
    for(let w=0;w<7;w++)
      g.appendChild(el("div","cov-c tot"+([0,6].includes(w)?" we":""), String((tpl[w]||[]).length)));
    host.appendChild(g);

    const total = monthDays(S.view.y,S.view.m).reduce((n,ds)=>n+slotsFor(ds).length,0);
    const targets = activeRoster().reduce((n,d)=>n+(+d.target||0),0);
    summary.textContent = `${total} shifts this month against ${targets} preferred across the roster`
      + (custom ? " · custom shape" : " · standard shape");
  }

  function toggle(slot, w){
    const tpl = ensureMonthTpl(S.view.y,S.view.m);
    const list = tpl[w] || (tpl[w]=[]);
    const i = list.indexOf(slot);
    if(i>=0){
      const hit = monthDays(S.view.y,S.view.m).filter(ds=> dowOf(ds)===w && at(ds,slot));
      if(hit.length && !confirm(
        `${SLOTS[slot].label} on ${DOW[w]}s currently has ${hit.length} doctor${hit.length>1?"s":""} placed. Remove the shift and unassign them?`
      )) return;
      hit.forEach(ds=> assign(ds,slot,null));
      list.splice(i,1);
    } else {
      list.push(slot);
    }
    save(); draw(); render();
  }

  draw();

  const reset = el("button","btn","Standard shape");
  reset.addEventListener("click", ()=>{
    const total = monthDays(S.view.y,S.view.m).reduce((n,ds)=>n+slotsFor(ds).length,0);
    if(!confirm("Reset this month to the standard weekday shape? Anyone on a shift that disappears will be unassigned.")) return;
    delete S.months[monthKey(S.view.y,S.view.m)];
    for(const ds of monthDays(S.view.y,S.view.m)){
      const keep = new Set(slotsFor(ds));
      for(const k of SLOT_ORDER) if(!keep.has(k) && at(ds,k)) assign(ds,k,null);
    }
    save(); draw(); render();
  });
  foot.appendChild(reset);

  const py = S.view.m===0 ? S.view.y-1 : S.view.y, pm = S.view.m===0 ? 11 : S.view.m-1;
  const copy = el("button","btn", "Copy " + new Date(py,pm,1).toLocaleDateString(undefined,{month:"short"}));
  copy.title = "Use last month's shape";
  copy.addEventListener("click", ()=>{
    const src = templateFor(py,pm);
    const tpl = ensureMonthTpl(S.view.y,S.view.m);
    for(let w=0;w<7;w++) tpl[w] = (src[w]||[]).slice();
    for(const ds of monthDays(S.view.y,S.view.m)){
      const keep = new Set(slotsFor(ds));
      for(const k of SLOT_ORDER) if(!keep.has(k) && at(ds,k)) assign(ds,k,null);
    }
    save(); draw(); render();
  });
  foot.appendChild(copy);

  foot.appendChild(el("span","spacer"));
  const done=el("button","btn primary","Done"); done.addEventListener("click", ()=>{closeModal();render();});
  foot.appendChild(done);
  showModal(m);
}

  const hard = el("div");

  ["Requests off — a day a doctor asked for cannot be scheduled",

  body.appendChild(el("div","pgroup","Soft rules — flagged, never blocked"));
  const soft = el("div");
  soft.appendChild(numField("Overnights in a row before warning", "maxConsecNights"));
  soft.appendChild(numField("Days worked in a row before warning", "maxConsecDays"));
  soft.appendChild(boolField("Warn when a doctor passes their preferred total", "warnOverTarget"));
  soft.appendChild(el("div","pgroup","Auto-fill"));
  const ps = el("div","f-row");
  const psl = el("div"); psl.style.cssText="flex:1;font-size:12.5px;color:var(--ink-2)";
  psl.textContent = "How hard to chase each doctor's shift ranking";
  const sel = el("select"); sel.style.cssText="width:auto;flex:none";
  [["balanced","Balanced — spread the load"],["strong","Follow preferences closely"]].forEach(([v,t])=>{
    const o=el("option","",t); o.value=v; if(S.rules.prefStrength===v) o.selected=true; sel.appendChild(o);
  });
  sel.addEventListener("change", ()=>{ S.rules.prefStrength=sel.value; save(); });
  ps.append(psl,sel); soft.appendChild(ps);
  soft.appendChild(el("div","hint","Balanced shares weekends and overnights out evenly. Following preferences closely lets specialists form — a doctor who ranks 6p–6a first will take most of the nights, the way the paper schedule ran."));
  soft.appendChild(el("div","hint","Blocked weekdays such as “no Thursdays” live on each doctor's card under Doctors, and always warn rather than block."));
  body.appendChild(soft);

  body.appendChild(el("div","pgroup","Coverage"));
  const cov = el("div");
  cov.appendChild(el("div","hint","The standard shape follows the master schedule: 6 doctors Fri/Sat/Sun, 5 Monday, 4 Tuesday through Thursday. To change a single month — November's extra 12p–12a on weekdays, say — click the month name at the top of the board."));
  body.appendChild(cov);

  body.appendChild(el("div","pgroup","Override"));
  const ov = el("div");
  ov.appendChild(boolField("Allow me to place a doctor despite a hard rule", "allowOverride"));
  ov.appendChild(el("div","hint","Off by default. In the historical schedule the day-after-night rule held on 92% of overnights, so real exceptions do happen — turn this on when you need one, and the placement will still show a red flag."));
  body.appendChild(ov);

  function numField(label,key){
    const w=el("div","f-row");
    const l=el("div"); l.style.flex="1"; l.textContent=label; l.style.fontSize="12.5px"; l.style.color="var(--ink-2)";
    const i=el("input"); i.type="number"; i.value=S.rules[key]; i.style.width="70px"; i.style.flex="none";
    i.addEventListener("input", ()=>{ S.rules[key]=parseInt(i.value,10)||1; save(); render(); });
    w.append(l,i); return w;
  }
  function boolField(label,key){
    const w=el("label","chk"); w.style.cssText="display:flex;gap:8px;padding:5px 0;font-size:12.5px";
    const i=el("input"); i.type="checkbox"; i.checked=!!S.rules[key];
    i.addEventListener("change", ()=>{ S.rules[key]=i.checked; save(); render(); });
    w.appendChild(i); w.appendChild(document.createTextNode(label)); return w;
  }
  foot.appendChild(el("span","spacer"));
  const done=el("button","btn primary","Done"); done.addEventListener("click", ()=>{closeModal();render();});
  foot.appendChild(done);
  showModal(m);
}

/* ---- data ---- */
function openData(){
  const {m, body, foot} = modalShell("Data", "Everything lives in this browser until you export it");
  const b1 = el("button","btn","Export month as CSV");
  b1.addEventListener("click", exportCsv);
  const b2 = el("button","btn","Export everything as JSON");
  b2.addEventListener("click", exportJson);
  const b3 = el("button","btn","Import JSON backup");
  b3.addEventListener("click", importJson);
  const b4 = el("button","btn","Print / save as PDF");
  b4.addEventListener("click", ()=>{ closeModal(); setTimeout(()=>window.print(),120); });
  const b5 = el("button","btn danger","Clear this month's assignments");
  b5.addEventListener("click", ()=>{
    if(!confirm("Clear every assignment in "+$("#mLabel").textContent+"? Roster and time off stay.")) return;
    monthDays(S.view.y,S.view.m).forEach(d=>delete S.schedule[d]);
    save(); closeModal(); render();
  });
  const b6 = el("button","btn danger","Reset everything");
  b6.addEventListener("click", ()=>{
    if(!confirm("Wipe roster, time off and all months? This cannot be undone.")) return;
    S = blankState(); save(); closeModal(); render();
  });
  [b1,b2,b3,b4].forEach(b=>{ b.style.cssText+=";display:block;width:100%;text-align:left;margin-bottom:7px"; body.appendChild(b); });
  body.appendChild(el("div","pgroup","Careful"));
  [b5,b6].forEach(b=>{ b.style.cssText+=";display:block;width:100%;text-align:left;margin-bottom:7px"; body.appendChild(b); });
  foot.appendChild(el("span","hint","Nothing is sent anywhere. Export a JSON backup before switching devices or clearing your browser."));
  showModal(m);
}
function download(name, text, type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCsv(){
  const rows=[["Date","Weekday","Slot","Doctor"]];
  for(const ds of monthDays(S.view.y,S.view.m)){
    for(const slot of slotsFor(ds)){
      rows.push([ds, DOW[dowOf(ds)], SLOTS[slot].label.replace("–","-"), at(ds,slot)||"OPEN"]);
    }
  }
  const csv = rows.map(r=>r.map(c=>/[",]/.test(c)?`"${c.replace(/"/g,'""')}"`:c).join(",")).join("\n");
  download(`herding-cats-${S.view.y}-${pad(S.view.m+1)}.csv`, csv, "text/csv");
}
function exportJson(){ download("herding-cats-backup.json", JSON.stringify(S,null,2), "application/json"); }
function importJson(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
  i.addEventListener("change", ()=>{
    const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const s=JSON.parse(r.result);
        if(!s.roster) throw new Error("not a backup");
        S=s; S.rules={...DEFAULT_RULES,...(S.rules||{})};
        save(); closeModal(); render();
      }catch(e){ flashBlock("That file could not be read as a backup"); }
    };
    r.readAsText(f);
  });
  i.click();
}

/* ============================================================
   8. WIRING
   ============================================================ */

$("#prevM").addEventListener("click", ()=>{ let{y,m}=S.view; m--; if(m<0){m=11;y--;} S.view={y,m}; render(); });
$("#nextM").addEventListener("click", ()=>{ let{y,m}=S.view; m++; if(m>11){m=0;y++;} S.view={y,m}; render(); });
$("#btnToday").addEventListener("click", ()=>{ const d=new Date(); S.view={y:d.getFullYear(),m:d.getMonth()}; render(); });
$("#mLabel").addEventListener("click", openMonthSetup);
$("#btnAuto").addEventListener("click", openAutofill);
$("#btnRoster").addEventListener("click", openRoster);
$("#btnRules").addEventListener("click", openRules);
$("#btnData").addEventListener("click", openData);

/* theme — resolved once so there is a single source of truth, then remembered */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#btnTheme").textContent = t==="dark" ? "☀" : "☾";
  $("#btnTheme").title = t==="dark" ? "Switch to light" : "Switch to dark";
}
if(!S.theme) S.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
applyTheme(S.theme);
$("#btnTheme").addEventListener("click", ()=>{
  S.theme = S.theme==="dark" ? "light" : "dark";
  applyTheme(S.theme); save();
});
$("#armX").addEventListener("click", ()=> toggleArm(armed));

// On narrow screens the side panels sit above the calendar and start folded,
// so the month is still the first thing you see.
const NARROW = ()=> window.matchMedia("(max-width:860px)").matches;
document.querySelectorAll(".panel.foldable").forEach(p=>{
  if(NARROW()) p.classList.add("folded");
  p.querySelector(".panel-h").addEventListener("click", ()=>{
    if(NARROW()) p.classList.toggle("folded");
  });
});
window.addEventListener("resize", ()=>{
  if(!NARROW()) document.querySelectorAll(".panel.foldable").forEach(p=>p.classList.remove("folded"));
});

render();
</script>
